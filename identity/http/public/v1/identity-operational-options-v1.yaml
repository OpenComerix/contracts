  "paths": {
    "/tenancy/operational-options": {
      "get": {
        "tags": [
          "Identity"
        ],
        "operationId": "listOperationalOptions",
        "summary": "List currently scoped active branch/POS pairs",
        "description": "Current active session/account/membership, MFA, proven approved device and current scopes. No sales permission, OWNER string, plan, preference or browser header grants discovery. Restricted/revoked sessions denied. Each later domain operation separately authorizes its own permission and resources. Only active branch/POS pairs belonging to the active organization and current membership scopes, preserving branch-to-POS relation. Names/versions come from Identity. No activation, rotation, reservation or creation. Default limit 50, maximum 100; ascending (branch_id,pos_id) keyset. Cursor opaque authenticated HMAC with exclusive server key, expires <=300s, binds account/session/device/organization/membership/authority versions, limit and last pair. Omitted continuation limit uses bound limit; mismatch/forgery/expiry =>400 tenancy_invalid_cursor; authority loss=>403 identity_access_denied; invalid session=>401 identity_session_invalid_or_expired. Revalidate each page; no snapshot guarantee. No body or organization selector. Duplicate/unknown query keys rejected; no implicit defaults in canonical requests.",
        "parameters": [
          {
            "name": "limit",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100,
              "default": 50
            },
            "description": "Page size; continuation inherits cursor limit."
          },
          {
            "name": "cursor",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "minLength": 1,
              "maxLength": 2048
            },
            "description": "Opaque authenticated continuation, never authority."
          }
        ],
        "responses": {
          "200": {
            "description": "Observed eligible options in the current active organization.",
            "headers": {
              "Cache-Control": {
                "description": "Normative response header.",
                "required": true,
                "schema": {
                  "const": "no-store"
                }
              },
              "ETag": {
                "description": "Normative response header.",
                "required": true,
                "schema": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 200
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "../../shared/v1/identity-operational-options-v1.schema.json#/$defs/HttpOperationalOptions"
                },
                "x-producer-schema": {
