      "put": {
        "tags": [
          "Identity"
        ],
        "operationId": "configureBranchTimeZone",
        "summary": "Configure the branch time zone explicitly",
        "description": "Current active session/account/membership, proven approved device, MFA and current branch scope in the active organization. No organization selector, query or GET body. Missing, inactive, foreign or out-of-scope branch yields the same 403 identity_access_denied without disclosing existence. Configuration null explicitly means no zone is configured; no inferred defaults or backfill. checked_at is a server observation, never an authorization grant. Requires tenant.branch.time-zone.manage as a current backend capability, not a role string. Initial OWNER capability assignment only; this operation cannot assign permissions. Require expected_version and Idempotency-Key UUIDv7. Local transaction atomically checks version, increments branch version, writes configuration and restricted audit, and stores exact replay. Replay requires current authority and returns its original response before version checks; conflicting key/body returns 409. Concurrent writes return 409 without effects. No update to existing commercial facts. Idempotency retention seven days; expired keys are not automatically safe to repeat. No step-up beyond the active MFA requirement. Gateway validates browser Origin and session-bound X-CSRF-Token before forwarding each mutation; on GET it validates Origin when present. Identity does not receive or validate browser Origin/CSRF and cannot accept those headers as authority. Identity independently enforces the current delegated caller, original session, gateway-derived signal and all authority requirements above; no service-only access or authority fallback.",
        "parameters": [
          {
            "name": "branch_id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid",
              "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
            },
            "description": "Opaque branch reference within the current organization."
          },
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid",
              "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
            },
            "description": "Immutable UUIDv7 for exact request replay."
          },
          {
            "name": "X-OC-Client-Signal",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^v1\\.[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$"
            },
            "description": "Gateway-derived signal bound to current delegation; remove browser copies, never log or treat as authority."
          }
        ],
        "security": [
          {
            "delegatedBearer": [],
            "originSession": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "../../shared/v1/identity-branch-time-zone-v1.schema.json#/$defs/Configure"
              }
            }
          }
        },
        "x-permission": "tenant.branch.time-zone.manage",
        "x-caller": "gateway-bff",
        "x-audience": "identity-tenancy.user-api",
        "responses": {
          "200": {
            "description": "Current zone or exact stored configuration result.",
            "headers": {
              "Cache-Control": {
