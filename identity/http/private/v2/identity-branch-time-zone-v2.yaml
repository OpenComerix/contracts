        "operationId": "getBranchTimeZone",
        "summary": "Read the current branch time zone",
        "description": "Current active session/account/membership, proven approved device, MFA and current branch scope in the active organization. No organization selector, query or GET body. Missing, inactive, foreign or out-of-scope branch yields the same 403 identity_access_denied without disclosing existence. Configuration null explicitly means no zone is configured; no inferred defaults or backfill. checked_at is a server observation, never an authorization grant. Gateway validates browser Origin and session-bound X-CSRF-Token before forwarding each mutation; on GET it validates Origin when present. Identity does not receive or validate browser Origin/CSRF and cannot accept those headers as authority. Identity independently enforces the current delegated caller, original session, gateway-derived signal and all authority requirements above; no service-only access or authority fallback.",
