      operationId: getCatalogHistoryPermissionAssignment
      summary: Read the current explicit permission assignment
      description: Authenticate gateway workload before interpreting body/path. Require live active
        selected organization/session/account/membership, approved organization device, current
        credentials, recent MFA (at most 300 seconds) and effective
        catalog.history.permissions.manage with explicit organization scope. Initial policy maps
        only that management permission to OWNER; neither OWNER alone nor this management permission
        assigns the three exceptional permissions. Return version zero, empty permissions and null
        updated_at if no assignment has existed. No request body or query parameters. Revalidate on
        every read; no authority cache.
