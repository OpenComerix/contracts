      operationId: replaceCatalogHistoryPermissionAssignment
      summary: Replace the three exceptional permissions explicitly
      description: Apply every GET authority check before effect or replay. Body and path are intent,
        never authority. Only catalog.history.authorize, catalog.history.configure and
        catalog.history.recover may be assigned; an empty list revokes all three, including
        self-assignment when authorized. The management permission cannot be assigned through this
        API. Atomically compare expected_version, replace the set, increment the durable assignment
        counter and target membership authorization version, store minimal idempotency result and
        append required audit. A new intent increments versions even when setting the same set.
        Version max is 9223372036854775807; no reset/wrap. No network IO under SQL locks.
        Idempotency scope is organization/operation/key and binds original actor account/membership,
        target, expected version and permission array order. Revalidate current authority before
        exact replay; return the original historical mutation result without extending
        ledger/session/MFA or writing another audit. A different actor/target/body with the same
        scoped key conflicts. Ledger retention is seven days; after expiry the old expected version
        prevents re-creation. GET obtains current state after a replay. Missing/invalid authority,
        audit/storage failure or dependency unavailability fails closed. At most 4096 UTF-8 request
        bytes and a 3000 ms total private deadline; do not infer rollback from response loss. No
        query parameters.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: UUIDv7 of this explicit replacement intent; replay requires the original key and body.
          schema:
            $ref: ../../shared/v1/identity-catalog-history-permissions-v1.schema.json#/$defs/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../shared/v1/identity-catalog-history-permissions-v1.schema.json#/$defs/ReplaceRequest
components:
  securitySchemes:
    gatewayServiceBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Existing H1A gateway-bff service profile: canonical caller gateway-bff, exact audience
        identity-tenancy.gateway. Does not carry the person authority."
    currentSessionCookie:
      type: apiKey
      in: cookie
      name: __Host-oc_session
      description: Current person session; never supplied in JSON and never returned to catalog-pricing.
  headers:
    NoStore:
      required: true
      description: Never cache successful responses or errors.
      schema:
        type: string
        const: no-store
