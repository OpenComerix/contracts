        "summary": "Check current Sales authority and branch time zone together",
        "description": "Identity checks current active session, account/membership/credential versions, MFA, proven approved device, permission and branch/POS scope. Bind exact seven-field public request and separate client signal. ES256 delegate <=60s; check lifetime and type/caller/audience. Decision <=2000ms measured from before network; no cache; revalidate after waits. History requires step-up <=900s for each page. Same request, delegate, client signal, workload caller/audience and current-human checks as checkSalesAuthorization; no authority fallback. In the same local consistent read, bind branch_time_zone organization/branch to the exact finalize body.context and authorization. Null when unconfigured; null for non-finalize operations. Zone is configuration, never a grant. Current decision lifetime covers the complete envelope. Accepted replay can be looked up after current authority without applying a new zone/day to the retained intention.",
