  /internal/identity/catalog-authorizations:
    post:
      operationId: checkCatalogAuthorization
      summary: Comprobar autoridad fresca de una solicitud de catálogo
      description: "Solo workload catalog-pricing presenta JWT propio y delegado en body. Recalcula hash
        público catalog-request-v1; identidad compara registro, señal, sesión/credencial actuales y
        todas las autoridades actuales. Permiso deriva de operationId, scope exclusivamente
        organizacional sin sucursal inferida. No confía en roles embebidos ni en tenant del
        navegador. Falla cerrada sin dependencia y revalida incluso al exponer replay. Operación de
        comprobación sin efecto comercial ni replay de decisión: cada llamada obtiene una decisión
        fresca."
      tags:
        - CatalogAuthority
      x-internal: true
      x-workload:
        caller: catalog-pricing
        audience: identity-tenancy.catalog-authority
        type: service
      security:
        - catalogServiceBearer: []
      parameters:
        - $ref: "#/components/parameters/ClientSignal"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: identity-catalog-authority-v1.schema.json#/$defs/AuthorizationRequest
            examples:
              request:
                externalValue: ../../../fixtures/catalog-authority/v1/examples/authorization-request.json
      responses:
        "200":
          description: Decisión autorizada ligada a operación/hash/registro/señal y referencias/versiones
            actuales. valid_for_ms ≤2000, step_up_valid_for_ms ≤valid_for_ms. Medir desde antes del
            envío con reloj monotónico, descontar red/waits. Sin consulta identidad con locks SQL.
            Revisar tras locks, antes de commit y antes de lecturas/replays. Step-up hasta 15 min
            solo para cambio fiscal de producto ya activo. Sin atomicidad distribuida.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: identity-catalog-authority-v1.schema.json#/$defs/AuthorizationResponse
              examples:
                success:
                  externalValue: ../../../fixtures/catalog-authority/v1/examples/authorization-response.json
        "400":
          description: Rechazo genérico, sin token, cookie, hash, señal, SQL ni pertenencia ajena. Nunca
            decisión denegada en 200.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
