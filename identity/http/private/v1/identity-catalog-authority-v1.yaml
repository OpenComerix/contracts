              schema:
                $ref: ../../../../common/http/shared/v3/problem-details-v3.schema.json
              examples:
                catalog_delegation_request_mismatch:
                  externalValue: ../../../fixtures/catalog-authority/v1/examples/problem-catalog_delegation_request_mismatch.json
                identity_access_denied:
                  externalValue: ../../../fixtures/catalog-authority/v1/examples/problem-identity_access_denied.json
                identity_device_not_approved:
                  externalValue: ../../../fixtures/catalog-authority/v1/examples/problem-identity_device_not_approved.json
                identity_mfa_required:
                  externalValue: ../../../fixtures/catalog-authority/v1/examples/problem-identity_mfa_required.json
                identity_reauthentication_required:
                  externalValue: ../../../fixtures/catalog-authority/v1/examples/problem-identity_reauthentication_required.json
                tenancy_membership_invalid:
                  externalValue: ../../../fixtures/catalog-authority/v1/examples/problem-tenancy_membership_invalid.json
        "406":
          description: Rechazo genérico, sin token, cookie, hash, señal, SQL ni pertenencia ajena. Nunca
            decisión denegada en 200.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
