components:
  securitySchemes:
    gatewayServiceBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: ES256; issuer configurado, kid vigente, aud identity-tenancy.gateway, type service,
        caller gateway-bff. No acredita CSRF.
    currentSessionCookie:
      type: apiKey
      in: cookie
      name: __Host-oc_session
      description: Cookie opaca vigente solo por HTTPS privado; no acepta cookie anterior ni la recibe catálogo.
    catalogServiceBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Credenciales propias catalog-pricing; ES256 issuer configurado, kid vigente, aud
        identity-tenancy.catalog-authority, type service, caller catalog-pricing.
  parameters:
    ClientSignal:
      name: X-OC-Client-Signal
      in: header
      required: true
      description: Valor único derivado por gateway desde ingress confiable; elimina copia del navegador.
        Se vincula al registro de emisión y se compara al comprobar autoridad. No transporta IP/HMAC
        secret, no concede permisos y no integra request_hash. Autenticar workload antes de validar
        sintaxis.
      schema:
        $ref: ../../../../catalog/http/shared/v1/catalog-common-v1.schema.json#/$defs/ClientSignal
  headers:
    NoStore:
      required: true
      description: Nunca cachear respuestas ni errores.
      schema:
        $ref: ../../../../catalog/http/shared/v1/catalog-common-v1.schema.json#/$defs/CacheControl
    RetryAfter:
      required: true
      description: Segundos antes del siguiente intento; no concede autoridad.
      schema:
        $ref: ../../../../catalog/http/shared/v1/catalog-common-v1.schema.json#/$defs/RetryAfter
  schemas: {}
