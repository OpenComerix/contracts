openapi: 3.1.0
info:
  title: OpenComerix Identity Catalog Authority API
  version: 1.0.0
  description: Dos puertos privados candidatos F1-07B. Identidad valida cuenta, sesión y credencial
    vigentes, organización, membresía, dispositivo aprobado, MFA y permiso. No hay autorización por
    headers libres ni caché de decisiones. HTTPS privado; ningún token interno llega al navegador.
    Los fixtures no acreditan firma JWT, HMAC, revocación runtime, SQL ni atomicidad distribuida.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://identity-tenancy.internal.example/api/v1
    description: Host privado ilustrativo; HTTPS con nombre validado.
tags:
  - name: CatalogAuthority
    description: Delegación y decisión fresca propiedad de identity-tenancy.
paths:
  /internal/identity/catalog-delegations:
    post:
      operationId: createCatalogDelegation
      summary: Emitir delegado para una solicitud de catálogo
      description: Gateway valida Origin/CSRF en el borde público y presenta JWT de servicio más cookie
        vigente. Identidad valida autoridad actual y conserva registro efímero de emisión que
        vincula sesión/credencial, operación/hash y señal. Emite ES256 exclusivo
        catalog-pricing.user-api; no admite delegados H2. Se comprueba nuevamente autoridad al
        ejecutar; no se reutilizan delegaciones entre solicitudes. El body nunca contiene cookie,
        actor o tenant elegido por cliente.
      tags:
        - CatalogAuthority
      x-internal: true
      x-workload:
        caller: gateway-bff
        audience: identity-tenancy.gateway
        type: service
      security:
        - gatewayServiceBearer: []
          currentSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ClientSignal"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: identity-catalog-authority-v1.schema.json#/$defs/DelegationRequest
            examples:
              request:
                externalValue: ../../../fixtures/catalog-authority/v1/examples/delegation-request.json
      responses:
        "200":
          description: Delegación ES256 válida hasta 60 s, no prolonga la sesión ni reemplaza autoridad.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: identity-catalog-authority-v1.schema.json#/$defs/DelegationResponse
              examples:
                success:
                  externalValue: ../../../fixtures/catalog-authority/v1/examples/delegation-response.json
        "400":
          description: Rechazo genérico, sin token, cookie, hash, señal, SQL ni pertenencia ajena. Nunca
            decisión denegada en 200.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/problem+json:
              schema:
                $ref: ../../../../common/http/shared/v3/problem-details-v3.schema.json
              examples:
                identity_invalid_request:
                  externalValue: ../../../fixtures/catalog-authority/v1/examples/problem-identity_invalid_request.json
        "401":
          description: Rechazo genérico, sin token, cookie, hash, señal, SQL ni pertenencia ajena. Nunca
            decisión denegada en 200.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/problem+json:
              schema:
                $ref: ../../../../common/http/shared/v3/problem-details-v3.schema.json
              examples:
                identity_session_invalid_or_expired:
                  externalValue: ../../../fixtures/catalog-authority/v1/examples/problem-identity_session_invalid_or_expired.json
                catalog_delegation_invalid:
                  externalValue: ../../../fixtures/catalog-authority/v1/examples/problem-catalog_delegation_invalid.json
        "403":
          description: Rechazo genérico, sin token, cookie, hash, señal, SQL ni pertenencia ajena. Nunca
            decisión denegada en 200.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
