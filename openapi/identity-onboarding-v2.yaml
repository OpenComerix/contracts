      operationId: confirmOwnerDeviceSelfApproval
      x-owner-session-flow-r8: >-
        Require otro dispositivo aprobado y utilizable en esa organización. Dentro de la transacción revalida eligibility; sin ese dispositivo, la recuperación excepcional permanece cerrada. La prueba vincula el candidato probado a esta sesión; no crea un vínculo genérico de cuenta. Tras rotar, permanece restricted.
      summary: Confirma autoaprobación con token de email y firma del dispositivo
      description: Exige conjuntamente token de un uso recibido por email verificado, sesión restricted, OWNER vigente para la organización, MFA/reautenticación recientes, otro dispositivo aprobado y utilizable en esa organización, y firma ECDSA P-256 válida del dispositivo candidato. El servidor comprueba que desafío y firma correspondan a cuenta, sesión y candidato, propósito owner_device_approval, organization_id, versión vigente y vencimiento; dentro de la transacción revalida OWNER y el otro dispositivo utilizable antes de consumir desafío y token atómicamente. Sin ese dispositivo, la recuperación excepcional permanece cerrada. Si la sesión no tiene dispositivo vinculado, vincula el candidato cuya posesión acaba de probarse; si ya existe vínculo, debe coincidir con ese candidato. No crea un vínculo genérico de cuenta. La operación registra aprobación solo para esa organización, rota la cookie y devuelve el estado posterior, que permanece restricted, sin organización activa, membresía, permisos ni scopes tenant. Solo una selección posterior puede activar un tenant. Ni el token ni un resultado de notifications bastan por sí solos. La aprobación web no activa un POS físico; next_actions es navegación, no autorización.
      security: [{sessionCookie: [], csrfToken: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/Traceparent'}]
