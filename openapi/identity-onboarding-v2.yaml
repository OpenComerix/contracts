      x-owner-session-flow-r8: >-
        Require otro dispositivo aprobado y utilizable en esa organización for both request and confirmation. Without it, sin el otro dispositivo utilizable la recuperación excepcional permanece cerrada. The confirmation transaction must revalidate it.
      summary: Solicita autoaprobación de un dispositivo nuevo del Propietario
      description: Para cuenta y email verificados, membresía OWNER vigente en organization_id, sesión restricted, MFA/reautenticación recientes, candidato pending_approval y otro dispositivo aprobado y utilizable en esa organización. Requiere la firma ECDSA P-256 del desafío vinculado server-side a esa cuenta, sesión, dispositivo, propósito owner_device_approval, organización y vencimiento; la verificación y consumo son atómicos. Sin el otro dispositivo utilizable la recuperación excepcional permanece cerrada. La primera solicitud crea y envía una sola vez material aleatorio de un uso con vencimiento de 30 minutos; el replay exacto de Idempotency-Key reproduce el OwnerDeviceApprovalPending original, conserva IDs, status, versión y expires_at, no reenvía correo y no extiende el vencimiento. La huella de idempotencia cubre la solicitud completa y toda repetición revalida autorización vigente. No devuelve already_issued, que corresponde únicamente al material TOTP de presentación única. La respuesta no incluye Set-Cookie ni X-CSRF-Token de rotación. La solicitud no aprueba el dispositivo ni concede acceso tenant.
      security: [{sessionCookie: [], csrfToken: []}]
      parameters: [{$ref: '#/components/parameters/DeviceId'}, {$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/Traceparent'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OwnerDeviceApprovalRequest'}
            example: {organization_id: '018f0000-0000-7000-8000-000000000906', challenge_id: '018f0000-0000-7000-8000-000000000921', challenge: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE, signature: jP1Ovmzd3abt71RKc2c69tH_P8UPhKAeeaQTLK8HWwdFaYg3S-JPeUGXoI6HiDNW6GtJMYIx3lR_fJE-PaBSUw, expected_membership_version: 2}
      responses:
        '504': {$ref: '#/components/responses/GatewayDeadlineExceeded'}
        '200':
          description: >-
            Primera solicitud o replay exacto de Idempotency-Key reproduce el
            OwnerDeviceApprovalPending original con los mismos IDs, status,
            versión y expires_at. El replay no reenvía correo, no extiende
            expiración y toda repetición revalida autoridad. El token nunca se
            devuelve; already_issued pertenece solo al replay TOTP. HTTP
            serializa Idempotency-Replayed como false o true fuera del JSON.
            Esta solicitud no rota cookie ni token CSRF.
          headers:
            Cache-Control: {schema: {type: string}, example: no-store}
            Idempotency-Replayed:
              description: 'Booleano; HTTP serializa los valores como `false` o `true`.'
              schema: {type: boolean}
