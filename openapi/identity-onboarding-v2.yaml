openapi: 3.1.0
info:
  title: OpenComerix Identity and Onboarding API
  version: 2.1.0
  description: >-
    Contrato sucesor v2 del corte inicial del Propietario para cuenta global, sesión web, MFA TOTP, aprobación
    de dispositivo y onboarding inicial de organización. Las mutaciones usan
    Idempotency-Key cuando se indica; el replay con el mismo payload devuelve
    el resultado original y con otro payload produce identity_idempotency_key_reused.
    Cada request/response admite correlation_id; se propagan causation_id
    cuando existe y traceparent conforme a W3C Trace Context. Rate limits se
        aplican por cuenta, señal y propósito. Ambos pasos de session step-up
        comparten el bucket session_step_up: identidad admite 10 intentos por
        cuenta y 100 por señal en 900 segundos; gateway admite 300 solicitudes
        por señal y propósito en esa ventana. Los límites por cuenta y señal
        son independientes y se suman a cinco intentos por desafío; una clave
        de idempotencia nueva no reinicia esos límites. La retención de
        idempotencia es de siete días, pero no garantiza disponibilidad de replay
        durante ese período. Respuestas autenticadas llevan Cache-Control: no-store.
    La cookie __Host-oc_session es Secure, HttpOnly, SameSite=Lax, Path=/ y sin
    Domain; vence tras 12 horas de inactividad y 30 días absolutos. Cada
    mutación autenticada requiere X-CSRF-Token y Origin validado. Correlation
    ID se propaga como X-Correlation-Id (o se genera uno) y se incluye en
    Problem Details; causation_id se conserva cuando hay causal previa.
    El gateway valida Origin exacto contra su allowlist y emite/verifica un
    X-CSRF-Token HMAC ligado a la cookie opaca actual; la PWA conserva ese token
    solo en memoria. Las respuestas 200/201 que emiten o rotan la cookie también
    emiten X-CSRF-Token y Cache-Control: no-store. Logout expira la cookie y no
    emite token CSRF nuevo. Toda mutación autenticada requiere cookie,
    X-CSRF-Token y Origin permitido. Origin ausente, null o ajeno, o token
    ausente, alterado o ligado a otra sesión produce 403 gateway_csrf_invalid
    sin parámetros ni detalle sensible. El gateway valida antes de invocar
    identidad; estos contratos no prueban el HMAC ni la validación de Origin.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://api.opencomerix.example/api/v1
    description: URL ilustrativa por ambiente.
security: []
paths:
  /identity/registrations:
    post:
      tags: [IdentityOnboarding]
      security: []
      operationId: registerGlobalAccount
      summary: Registra una cuenta global y solicita verificar su email
      description: Crea una cuenta global con los datos de perfil requeridos y solicita verificar el email. No vincula implícitamente una sesión ni activa una organización. Responde de forma genérica para evitar enumerar cuentas; la contraseña solo se acepta en el request y nunca se devuelve ni registra.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/Traceparent'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegistrationRequest'}
            examples:
              valid: {value: {email: persona@example.invalid, password: 'ejemplo-seguro-no-real', first_name: Ana, last_name: Pérez, birth_date: '1990-01-02', country: AR, province: Buenos Aires, locality: La Plata, postal_code: '1900', address: 'Calle de ejemplo 123'}}
      responses:
        '504': {$ref: '#/components/responses/GatewayDeadlineExceeded'}
        '200': {description: Solicitud aceptada con respuesta genérica, headers: {Cache-Control: {schema: {type: string}, example: no-store}}, content: {application/json: {schema: {$ref: '#/components/schemas/RegistrationAccepted'}}}}
        '400': {description: 'Solicitud inválida, incluido un campo requerido ausente.', content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}, example: {type: 'urn:opencomerix:problem:identity_invalid_request', title: Solicitud inválida, status: 400, instance: 'urn:uuid:01991a22-0000-7000-8000-000000000001', code: identity_invalid_request, trace_id: '018f0000-0000-7000-8000-000000000009', retryable: false}}}}
        '409': {$ref: '#/components/responses/IdempotencyConflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '500': {$ref: '#/components/responses/InternalError'}
  /identity/email-verifications:
    post:
      tags: [IdentityOnboarding]
      security: []
      operationId: verifyEmail
      summary: Verifica el email con un token de un solo uso
      description: Consume un token de verificacion de email de un solo uso. Un token invalido, vencido o ya utilizado produce una respuesta indistinguible y no revela el estado de una cuenta.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/Traceparent'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/EmailVerificationRequest'}, example: {token: 'valor-ejemplo-no-funcional'}}}}
      responses:
        '504': {$ref: '#/components/responses/GatewayDeadlineExceeded'}
        '200': {description: Verificación completada o respuesta genérica, headers: {Cache-Control: {schema: {type: string}, example: no-store}}, content: {application/json: {schema: {$ref: '#/components/schemas/EmailVerificationResponse'}, examples: {verified: {value: {status: verified, next_actions: [enroll_mfa, register_device, create_organization]}}, expired_or_used: {value: {status: not_verified, next_actions: [verify_email]}}}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '409': {$ref: '#/components/responses/IdempotencyConflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '500': {$ref: '#/components/responses/InternalError'}
  /identity/sessions:
    post:
      tags: [IdentityOnboarding]
      security: []
      operationId: createSession
      summary: Inicia sesión
      description: >-
        Autentica la cuenta global con email y contraseña. Si TOTP está enrolado
        devuelve challenge_id, vencimiento y cookie opaca temporal restringida;
        solo POST /identity/mfa/challenges consume el challenge. Sin TOTP, la
        sesión restringida permite únicamente enrolamiento/confirmación MFA,
        registro del dispositivo y bootstrap inicial aplicable. El login y
        completar MFA nunca conceden autoridad tenant: todo estado restricted
        o mfa_pending carece de organización, membresía, permisos y scopes
        tenant. El registro no vincula implícitamente la sesión ni activa una
        organización. Credenciales inválidas no revelan si la cuenta existe;
        replay idempotente no crea sesiones adicionales.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/Traceparent'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LoginRequest'}, examples: {valid: {value: {email: persona@example.invalid, password: 'ejemplo-seguro-no-real'}}, invalid_credentials: {value: {email: desconocido@example.invalid, password: 'credencial-ejemplo'}}}}}}
      responses:
        '504': {$ref: '#/components/responses/GatewayDeadlineExceeded'}
        '200':
          description: >-
            Sesión restringida emitida solo mediante Set-Cookie; incluye challenge_id si MFA está pendiente. No concede autoridad tenant, aun después de completar MFA, sin una transición explícita de activación.
          headers: {X-CSRF-Token: {$ref: '#/components/headers/CsrfToken'}, Set-Cookie: {schema: {type: string}, description: 'Cookie __Host-oc_session opaca; Secure; HttpOnly; SameSite=Lax; Path=/; sin Domain.'}, Cache-Control: {$ref: '#/components/headers/NoStore'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LoginResponse'}
              examples:
                authenticated_restricted:
                  value: {status: restricted, session_expires_at: '2026-10-01T12:00:00Z', next_actions: [enroll_mfa]}
                mfa_pending:
                  value: {status: mfa_pending, challenge_id: '018f0000-0000-7000-8000-000000000004', challenge_expires_at: '2026-10-01T12:05:00Z', next_actions: [complete_mfa]}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {description: Credenciales inválidas; respuesta indistinguible para cuenta ausente, headers: {Cache-Control: {schema: {type: string}, example: no-store}}, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}, example: {type: 'urn:opencomerix:problem:identity_invalid_credentials', title: No autenticado, status: 401, instance: 'urn:uuid:01991a22-0000-7000-8000-000000000001', code: identity_invalid_credentials, trace_id: '018f0000-0000-7000-8000-000000000002', retryable: false}}}}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '500': {$ref: '#/components/responses/InternalError'}
  /identity/session:
    get:
      tags: [IdentityOnboarding]
      operationId: getCurrentSession
      summary: Consulta el contexto de sesión actual
      description: Devuelve el SessionContext posterior al efecto vigente, sin incluir la credencial de sesion. next_actions conserva sus valores como navegacion, nunca permisos ni aprobacion local. register_device requiere resolver el dispositivo de la sesion sin vinculo despues de email verificado y MFA elegible; create_organization requiere elegibilidad real del primer bootstrap; approve_device requiere candidato pendiente vinculado, OWNER vigente y otro dispositivo aprobado y utilizable en esa organizacion; select_organization requiere dispositivo probado globalmente aprobado y MFA elegible, pero no garantiza aprobacion para todas las organizaciones.
      security: [{sessionCookie: []}]
      responses:
        '504': {$ref: '#/components/responses/GatewayDeadlineExceeded'}
        '200': {description: Contexto vigente; no incluye la credencial de sesión., headers: {X-CSRF-Token: {$ref: '#/components/headers/CsrfToken'}, Cache-Control: {$ref: '#/components/headers/NoStore'}}, content: {application/json: {schema: {$ref: '#/components/schemas/SessionContext'}, examples: {restricted_after_login: {externalValue: examples/owner-session-flow-v1-restricted-after-login.json}, restricted_after_mfa: {externalValue: examples/owner-session-flow-v1-restricted-after-mfa.json}, restricted_after_device_proof: {externalValue: examples/owner-session-flow-v1-restricted-device-proof.json}, restricted_after_owner_confirmation: {externalValue: examples/owner-session-flow-v1-restricted-owner-confirmation.json}, restricted_after_pending_candidate_proof: {externalValue: examples/owner-session-flow-v1-restricted-pending-candidate.json}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    delete:
      tags: [IdentityOnboarding]
      operationId: logoutCurrentSession
      description: >-
        Revoca idempotentemente la sesión autenticada actual y expira la cookie
        segura del navegador; requiere Idempotency-Key UUIDv7, cookie, Origin
        permitido y protección CSRF. La repetición exacta no duplica el efecto
        ni la auditoría y devuelve 204 con la cookie expirada. Solo después de
        un rechazo explícito que identifique una sesión ya inválida, si el
        gateway presentó una cookie y Origin/CSRF fueron válidos, puede usar
        204 para limpiar localmente esa cookie. Cookie ausente, Origin/CSRF
        inválido o indisponibilidad no se convierten en logout exitoso.
      summary: Cierra la sesión actual
      security: [{sessionCookie: [], csrfToken: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/Traceparent'}]
      responses:
        '504': {$ref: '#/components/responses/GatewayDeadlineExceeded'}
        '204': {description: Sesión revocada y cookie expirada., headers: {Set-Cookie: {schema: {type: string}, description: Expira __Host-oc_session con atributos seguros.}, Cache-Control: {schema: {type: string}, example: no-store}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AuthenticatedMutationForbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /identity/session-revocations:
    post:
      tags: [IdentityOnboarding]
      operationId: revokeOtherSessions
      summary: Revoca las demás sesiones de la cuenta
      description: Revoca las demas sesiones de la cuenta conservando la actual. Requiere version de seguridad esperada y clave de idempotencia; los conflictos de version no se aplican parcialmente.
      security: [{sessionCookie: [], csrfToken: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/Traceparent'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SessionRevocationRequest'}, example: {except_current: true, expected_security_version: 3}}}}
      responses:
        '504': {$ref: '#/components/responses/GatewayDeadlineExceeded'}
        '200': {description: Resultado de revocación., headers: {Cache-Control: {schema: {type: string}, example: no-store}}, content: {application/json: {schema: {$ref: '#/components/schemas/SessionRevocationResponse'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AuthenticatedMutationForbidden'}
        '409': {$ref: '#/components/responses/StateConflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /identity/step-up-challenges:
    post:
      tags: [IdentityOnboarding]
      operationId: createSessionStepUpChallenge
      summary: Inicia el primer factor de un step-up explícito de sesión
      description: >-
        Requiere cuenta activa con email verificado, contraseña local correcta,
        MFA enrolado y sesión vigente restricted o active sin desafío de MFA de
        login pendiente. La contraseña verificada crea un desafío de propósito
        step_up, ligado a la cuenta, sesión, hash de credencial y versión de seguridad
        vigentes; no acredita step-up completo ni rota la cookie. El desafío vence
        en un máximo de cinco minutos, admite cinco intentos y un desafío nuevo
        autorizado sustituye pendientes sin invalidar por sí mismo evidencia
        completa vigente. La operación no cambia tenant, permisos, scopes ni
        vencimientos de sesión. Replay idempotente conserva 201, body y Location
        mientras el desafío siga pendiente, vinculado y vigente; no reenvía ni
        extiende su expiración. El rate-limit usa el propósito independiente
        session_step_up compartido con la confirmación. Password no se devuelve
        ni registra.
      security: [{sessionCookie: [], csrfToken: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/Traceparent'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SessionStepUpChallengeRequest'}
            examples:
              valid: {value: {password: 'ejemplo-seguro-no-real'}}
      responses:
        '504': {$ref: '#/components/responses/StepUpGatewayDeadlineExceeded'}
        '201':
          description: Desafío pendiente de segundo factor; no instala step-up ni rota credencial.
          headers:
            Location: {schema: {type: string, format: uri-reference, pattern: '^/api/v1/identity/step-up-challenges/[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'}, example: /api/v1/identity/step-up-challenges/018f0000-0000-7000-8000-000000000951}
            Cache-Control: {$ref: '#/components/headers/NoStore'}
            Idempotency-Replayed: {required: true, description: Booleano HTTP false en primera emisión y true en replay exacto., schema: {type: boolean}, examples: {first_effect: {value: false}, exact_replay: {value: true}}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionStepUpChallengeResponse'}
              examples:
                first_effect: {value: {challenge_id: '018f0000-0000-7000-8000-000000000951', status: mfa_required, expires_at: '2026-10-02T12:05:00Z'}}
                exact_replay: {value: {challenge_id: '018f0000-0000-7000-8000-000000000951', status: mfa_required, expires_at: '2026-10-02T12:05:00Z'}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/StepUpUnauthorized'}
        '403':
          description: Contraseña inválida o sesión sin método de step-up elegible; CSRF inválido se clasifica aparte en el gateway.
          headers: {Cache-Control: {$ref: '#/components/headers/NoStore'}}
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              examples:
                reauthentication_required: {value: {type: 'urn:opencomerix:problem:identity_reauthentication_required', title: Se requiere reautenticación, status: 403, instance: 'urn:uuid:01991a22-0000-7000-8000-000000000951', code: identity_reauthentication_required, trace_id: '018f0000-0000-7000-8000-000000000951', retryable: false}}
                mfa_required: {value: {type: 'urn:opencomerix:problem:identity_mfa_required', title: Se requiere completar MFA, status: 403, instance: 'urn:uuid:01991a22-0000-7000-8000-000000000953', code: identity_mfa_required, trace_id: '018f0000-0000-7000-8000-000000000953', retryable: false}}
                csrf_invalid: {externalValue: examples/gateway-csrf-invalid-v3.json}
        '409': {$ref: '#/components/responses/IdempotencyConflict'}
        '429': {$ref: '#/components/responses/StepUpRateLimited'}
        '500': {$ref: '#/components/responses/StepUpInternalError'}
        '503': {$ref: '#/components/responses/StepUpUnavailable'}
  /identity/step-up-confirmations:
    post:
      tags: [IdentityOnboarding]
      operationId: completeSessionStepUp
      summary: Completa el step-up explícito y rota la credencial actual
      description: >-
        Consume atómicamente el desafío step_up y un TOTP o código de
        recuperación de un solo uso ligado a la misma cuenta y sesión. Login,
        MFA de login y enrolamiento no acreditan este step-up. Confirma y rota
        la credencial en la misma sesión; no crea sesión, activa tenant, aprueba
        dispositivos, asigna permisos/scopes ni extiende vencimientos. La vigencia
        efectiva de reautenticación es el mínimo entre los vencimientos de sesión
        y quince minutos desde la contraseña verificada; reauthenticated_at y MFA
        reflejan el consumo, sin reiniciar ese reloj. El bucket rate-limit
        independiente es session_step_up, compartido con la creación. Replay exacto conserva 200,
        body y la credencial ya rotada sin segundo consumo, rotación ni extensión.
        Credenciales y códigos son writeOnly y no aparecen en respuestas ni logs.
      security: [{sessionCookie: [], csrfToken: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/Traceparent'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SessionStepUpConfirmationRequest'}
            examples:
              valid_totp: {value: {challenge_id: '018f0000-0000-7000-8000-000000000951', code: '123456'}}
              valid_recovery: {value: {challenge_id: '018f0000-0000-7000-8000-000000000951', code: 'RECUPERACION-EJEMPLO-NO-FUNCIONAL'}}
      responses:
        '504': {$ref: '#/components/responses/StepUpGatewayDeadlineExceeded'}
        '200':
          description: Step-up confirmado y credencial de la misma sesión rotada; no concede autoridad tenant.
          headers:
            X-CSRF-Token: {$ref: '#/components/headers/CsrfToken'}
            Set-Cookie: {required: true, schema: {type: string}, description: Cookie segura rotada de la misma sesión.}
            Cache-Control: {$ref: '#/components/headers/NoStore'}
            Idempotency-Replayed: {required: true, description: Booleano HTTP false en primera ejecución y true en replay exacto., schema: {type: boolean}, examples: {first_effect: {value: false}, exact_replay: {value: true}}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionStepUpCompleted'}
              examples:
                first_effect: {value: {status: step_up_completed, reauthenticated_at: '2026-10-02T12:00:00Z', expires_at: '2026-10-02T12:15:00Z'}}
                exact_replay: {value: {status: step_up_completed, reauthenticated_at: '2026-10-02T12:00:00Z', expires_at: '2026-10-02T12:15:00Z'}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/StepUpUnauthorized'}
        '403':
          description: Reautenticación no elegible o MFA de login pendiente; CSRF inválido se clasifica aparte en el gateway.
          headers: {Cache-Control: {$ref: '#/components/headers/NoStore'}}
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              examples:
                reauthentication_required: {value: {type: 'urn:opencomerix:problem:identity_reauthentication_required', title: Se requiere reautenticación, status: 403, instance: 'urn:uuid:01991a22-0000-7000-8000-000000000952', code: identity_reauthentication_required, trace_id: '018f0000-0000-7000-8000-000000000952', retryable: false}}
                mfa_required: {value: {type: 'urn:opencomerix:problem:identity_mfa_required', title: Se requiere completar MFA, status: 403, instance: 'urn:uuid:01991a22-0000-7000-8000-000000000953', code: identity_mfa_required, trace_id: '018f0000-0000-7000-8000-000000000953', retryable: false}}
                csrf_invalid: {externalValue: examples/gateway-csrf-invalid-v3.json}
        '409': {$ref: '#/components/responses/IdempotencyConflict'}
        '422':
          description: Factor o desafío inválido, vencido, sustituido o agotado; no instala step-up.
          headers: {Cache-Control: {$ref: '#/components/headers/NoStore'}}
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              examples:
                mfa_invalid: {value: {type: 'urn:opencomerix:problem:identity_mfa_invalid', title: Código no válido, status: 422, instance: 'urn:uuid:01991a22-0000-7000-8000-000000000956', code: identity_mfa_invalid, trace_id: '018f0000-0000-7000-8000-000000000956', retryable: false}}
        '429': {$ref: '#/components/responses/StepUpRateLimited'}
        '500': {$ref: '#/components/responses/StepUpInternalError'}
        '503': {$ref: '#/components/responses/StepUpUnavailable'}
  /identity/mfa/totp-enrollments:
    post:
      tags: [IdentityOnboarding]
      operationId: beginTotpEnrollment
      summary: Inicia el enrolamiento TOTP
      description: Inicia el enrolamiento TOTP de la cuenta autenticada. Secreto y URI solo aparecen en la primera respuesta; un replay exacto indica already_issued sin volver a exponer material sensible.
      security: [{sessionCookie: [], csrfToken: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/Traceparent'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TotpEnrollmentRequest'}, example: {label: navegador-principal}}}}
      responses:
        '504': {$ref: '#/components/responses/GatewayDeadlineExceeded'}
        '201': {description: 'Primera emisión del material TOTP temporal; no registrar ni cachear.', headers: {Location: {schema: {type: string, format: uri-reference}, example: /identity/mfa/totp-enrollments/018f0000-0000-7000-8000-000000000003}, Cache-Control: {schema: {type: string}, example: no-store}, Idempotency-Replayed: {schema: {type: boolean}, example: false}}, content: {application/json: {schema: {$ref: '#/components/schemas/TotpEnrollmentFirstResponse'}, example: {status: issued, enrollment_id: '018f0000-0000-7000-8000-000000000003', secret: 'SECRETO-OMITIDO', otpauth_uri: 'otpauth://totp/OpenComerix:ejemplo?secret=OMITIDO&issuer=OpenComerix', expires_at: '2026-09-25T12:10:00Z'}}}}
        '200': {description: 'Replay exacto: no regenera ni recupera secreto o URI.', headers: {Cache-Control: {schema: {type: string}, example: no-store}, Idempotency-Replayed: {schema: {type: boolean}, example: true}}, content: {application/json: {schema: {$ref: '#/components/schemas/SensitiveMaterialReplay'}, example: {status: already_issued}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AuthenticatedMutationForbidden'}
        '409': {$ref: '#/components/responses/StateConflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /identity/mfa/totp-enrollments/{enrollmentId}/confirmations:
    post:
      tags: [IdentityOnboarding]
      operationId: confirmTotpEnrollment
      summary: Confirma TOTP y emite códigos de recuperación una sola vez
      description: Confirma el enrolamiento con un codigo TOTP vigente y emite codigos de recuperacion una sola vez. Un replay exacto indica already_issued sin repetirlos.
      security: [{sessionCookie: [], csrfToken: []}]
      parameters: [{$ref: '#/components/parameters/EnrollmentId'}, {$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/Traceparent'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TotpConfirmationRequest'}, example: {code: '000000'}}}}
      responses:
        '504': {$ref: '#/components/responses/GatewayDeadlineExceeded'}
        '200': {description: 'Primera emisión: Idempotency-Replayed false, con códigos de recuperación de un solo uso. Replay exacto: Idempotency-Replayed true y status already_issued, sin volver a exponer códigos.', headers: {Cache-Control: {schema: {type: string}, example: no-store}, Idempotency-Replayed: {schema: {type: boolean}, description: 'false para primera emisión; true para replay exacto already_issued.'}}, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/TotpConfirmationResponse'}, {$ref: '#/components/schemas/SensitiveMaterialReplay'}]}, examples: {first_issuance: {summary: 'Primera emisión (Idempotency-Replayed: false)', value: {status: issued, mfa_status: enrolled, recovery_codes: [RECOVERY-CODE-OMITIDO]}}, replay: {summary: 'Replay (Idempotency-Replayed: true)', value: {status: already_issued}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AuthenticatedMutationForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/StateConflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /identity/mfa/challenges:
    post:
      tags: [IdentityOnboarding]
      security: [{sessionCookie: [], csrfToken: []}]
      operationId: completeMfaChallenge
      summary: Completa el desafío MFA de login
      description: >-
        Verifica el código TOTP o de recuperación del challenge_id de login vinculado en servidor a la misma sesión restringida creada por createSession. La PWA presenta la cookie restringida y CSRF, sin JWT interno; el gateway añade su JWT de servicio solo en el salto privado a identity-tenancy. Consume desafío y factor de un solo uso de manera atómica y rota la cookie opaca. El estado posterior continúa restricted, sin organización, membresía, permisos o scopes tenant; completar MFA no concede autoridad tenant.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/Traceparent'}]
