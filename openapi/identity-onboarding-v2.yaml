      summary: Crea atómicamente organización, sucursal, POS lógico y membresía OWNER
      description: Camino atómico propio y exclusivo del primer Propietario sin membresías previas, con email verificado, sesión restricted con MFA/reautenticación recientes y dispositivo registrado cuya posesión se prueba aquí. La firma ECDSA P-256 del desafío server-side debe vincular cuenta, sesión, device_id, propósito bootstrap_organization, nonce, vencimiento y versión del dispositivo. identity-tenancy verifica y consume el desafío atómicamente dentro de la misma transacción que crea organización, sucursal, POS lógico, membresía INTERNAL OWNER y aprobación del dispositivo para la organización nueva; registra auditoría, activa ese contexto posterior y rota la cookie. Un fallo no deja aprobación ni recursos parciales. No sustituye selección ordinaria ni asigna licencia, POS físico, fiscalidad o permiso offline; el cliente no declara autoridad por organization_id.
      security: [{sessionCookie: [], csrfToken: []}]
