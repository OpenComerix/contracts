  /identity/device-registration-challenges:
    post:
      tags: [IdentityOnboarding]
      security: [{sessionCookie: [], csrfToken: []}]
      operationId: createDeviceRegistrationChallenge
      summary: Emite un desafío efímero para probar posesión de clave de dispositivo
      description: >-
        Antes de solicitar el desafío, el navegador genera con WebCrypto un par
        ECDSA P-256/SHA-256 cuya clave privada no es exportable y permanece
        local. Envía la JWK pública candidata junto con key_algorithm; el
        servidor vincula y persiste esa candidata con el desafío aleatorio de
        32 bytes, la cuenta, la sesión restringida, el propósito registration y
        su vencimiento. El navegador firma exactamente UTF-8 de
        `OpenComerix/device-proof/v1\n` + challenge_id + `\n` + challenge + `\n`;
        la firma WebCrypto es raw `r || s` de 64 bytes. En
        POST /identity/devices presenta la misma JWK pública. El servidor
        compara su forma canónica con la candidata persistida antes de
        verificar la firma y consume el desafío atómicamente una sola vez. La
        sesión restringida solo permite registrar el dispositivo y solicitar
        aprobación; no concede acceso tenant ni activa un POS físico.
        Para la misma Idempotency-Key y carga canónica se devuelve el mismo
        challenge_id, nonce y vencimiento originales incluso si el desafío ya
        expiró; el replay no crea otro desafío ni extiende los cinco minutos.
        Una clave nueva solicita un desafío nuevo. El resultado solo se entrega
        por el canal autenticado y nunca se registra en logs ni eventos.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/Traceparent'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DeviceChallengeRequest'}, example: {key_algorithm: ECDSA_P256, public_key: {kty: EC, crv: P-256, x: ptE8S_rlKwJbCVU0nvO5Ar4vjak0QbW3vLYQUE8FPRw, y: jm-uemUYGs6gAOrgH8iUep9iajUiQdmJDbKTzGJMcbA}}}}}
      responses:
        '504': {$ref: '#/components/responses/GatewayDeadlineExceeded'}
        '403': {$ref: '#/components/responses/AuthenticatedMutationForbidden'}
        '200':
          description: Desafío temporal de cinco minutos. El replay exacto devuelve el mismo nonce y expires_at originales, incluso vencidos; no se extiende ni se registra.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
            Idempotency-Replayed:
              description: Booleano; HTTP serializa los valores como `false` o `true`.
              schema: {type: boolean}
              examples: {first_issue: {value: false}, exact_replay: {value: true}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeviceChallengeResponse'}
              examples:
                first_issue: {externalValue: examples/identity-session-rotation-replay-v5-public-registration-challenge.json}
                exact_replay: {externalValue: examples/identity-session-rotation-replay-v5-public-registration-challenge.json}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /identity/device-authentication-challenges:
    post:
      tags: [IdentityOnboarding]
      operationId: createRegisteredDeviceAuthenticationChallenge
      summary: Emite un desafío de posesión para activar o renovar una sesión
      description: >-
        Emite un desafío aleatorio de 32 bytes con ECDSA_P256/SHA-256 para una
        sesión restringida o activa. El servidor lo vincula a cuenta, sesión,
        device_id, propósito, organization_id cuando corresponda y vencimiento.
        Para la misma Idempotency-Key y carga canónica se devuelve el mismo
        challenge_id, nonce y vencimiento originales incluso si el desafío ya
        expiró; el replay no crea otro desafío ni extiende los cinco minutos.
        Una clave nueva solicita un desafío nuevo. El navegador firma la
        serialización UTF-8 canónica del contrato; solo la clave registrada de
        ese dispositivo puede probar posesión. El desafío se consume
        atómicamente una vez. Esta prueba no concede permisos tenant; al
        consumirla se revalidan MFA y aprobación vigente para la organización.
        El resultado solo se entrega por el canal autenticado y nunca se
        registra en logs ni eventos.
      security: [{sessionCookie: [], csrfToken: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/Traceparent'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeviceAuthenticationChallengeRequest'}
            example: {device_id: '018f0000-0000-7000-8000-000000000904', purpose: activate_session, organization_id: '018f0000-0000-7000-8000-000000000906'}
      responses:
        '504': {$ref: '#/components/responses/GatewayDeadlineExceeded'}
        '200':
          description: Desafío temporal de cinco minutos. El replay exacto devuelve el mismo nonce y expires_at originales, incluso vencidos; no se extiende ni se registra.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
            Idempotency-Replayed:
              description: Booleano; HTTP serializa los valores como `false` o `true`.
              schema: {type: boolean}
              examples: {first_issue: {value: false}, exact_replay: {value: true}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeviceAuthenticationChallenge'}
              examples:
                first_issue: {externalValue: examples/identity-session-rotation-replay-v5-public-authentication-challenge.json}
                exact_replay: {externalValue: examples/identity-session-rotation-replay-v5-public-authentication-challenge.json}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AuthenticatedMutationForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/StateConflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /identity/device-authentications:
    post:
      tags: [IdentityOnboarding]
      operationId: proveRegisteredDevicePossession
      summary: Presenta firma del dispositivo y rota la cookie de sesión
      description: Verifica y consume atómicamente una firma de desafío de un solo uso vinculada a la misma cuenta, sesión, dispositivo y propósito; la cookie siempre se rota. La prueba válida vincula el dispositivo probado a la sesión. Sin organization_id explícito, la respuesta posterior permanece restricted y con tenant nulo, incluso con aprobación global del dispositivo. Con destino explícito, solo activa la sesión después de revalidar destino, membresía activa y versión, aprobación vigente específica para esa organización, MFA elegible y permisos/scopes. Un dispositivo pendiente solo conserva sesión restricted. renew_session rota la credencial y conserva el mismo dispositivo y tenant activos; nunca activa otra organización. next_actions es navegación derivada, no permiso ni aprobación local.
      security: [{sessionCookie: [], csrfToken: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/Traceparent'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeviceAuthenticationProof'}
            example: {challenge_id: '018f0000-0000-7000-8000-000000000911', challenge: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE, device_id: '018f0000-0000-7000-8000-000000000904', signature: zJV_UX1p1bikqQiRtIgX4HoYaKf2R4uiua4ggfE089s9o2WXaAO59WI7IQ5UwIYPSlHD4yZ4S7I13-lpbw5mAg}
      responses:
