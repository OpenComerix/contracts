openapi: 3.1.0
info:
  title: OpenComerix Gateway to Identity Delegation API
  version: 2.0.6
  description: >-
    Contrato aditivo para el enlace privado entre gateway-bff e
    identity-tenancy. El JWT de servicio del gateway tiene audiencia fija
    identity-tenancy.gateway. Autoriza registro, verificacion de email y login;
    completeMfaChallenge requiere ademas la cookie restringida de esa sesion y
    CSRF, sin aceptar JWT delegado. El token tambien habilita solicitar esta
    delegacion. Esta operacion exige ademas la cookie
    opaca de sesion recibida por HTTPS privado. identity-tenancy valida la
    sesion vigente antes de emitir un JWT ES256 type=delegated, caller=gateway-bff,
    audiencia identity-tenancy.user-api y vigencia maxima de 60 segundos. El
    JWT no contiene cookies ni secretos, no prolonga la sesion y no reemplaza
    autorizacion; identity-tenancy vuelve a validar sesion y permisos en cada
    operacion. Una sesion restringida no recibe referencias ni privilegios
    tenant. Ningun JWT interno se devuelve a la PWA. Este documento describe
    exclusivamente el salto privado gateway-bff a identity-tenancy; el
    OpenAPI identity-onboarding-v2.yaml describe la API publica del gateway
    y sus operaciones externas nunca exigen service JWT ni delegated JWT del
    navegador.
    CSRF and exact-Origin validation are performed by gateway-bff at the
    browser-facing boundary before this private hop. The service JWT proves
    workload identity only; it is not a CSRF-validation attestation. No internal
    CSRF-validated header is accepted or trusted by identity-tenancy. A prior
    session cookie never obtains an ordinary delegation. The only exception is
    the narrowly scoped session-rotation replay operation below, which requires
    this gateway service JWT, that prior cookie, the original operation's
    Idempotency-Key and its exact original request; it returns the preserved
    public result and replacement session credential only to this private
    authenticated caller. It never repeats domain effects or grants general
    authentication to the previous cookie.
    PF1-06A-R6 versions this private document as 2.0.6 while the public
    identity-onboarding contract remains 2.0.5. The required private
    X-OC-Client-Signal applies only to the 19 operationIds inventoried in the
    policy extension: four service-only and fifteen delegated. It is a
    rate-limit signal, not authority. gateway-bff strips any browser-supplied
    copy and derives v1. plus canonical unpadded base64url HMAC-SHA-256 of a
    verified public origin (complete IPv4 or IPv6 /64), using domain
    separation and an exclusive CSPRNG secret of at least 32 bytes. The
    identity service authenticates its internal gateway JWT before syntax
    checking; it does not share or verify the HMAC secret and does not accept
    X-Forwarded-* as a substitute. Missing, duplicate or malformed values fail
    closed with generic cataloged identity_invalid_request. The two
    notifications material routes are excluded. Purpose-scoped limits are
    10/account and 100/signal in separate 15-minute windows, configurable by
    environment and not by organization. PF1-06C implements derivation from
    explicitly trusted ingress. Contract fixtures prove syntax and inventory
    only, not HMAC, actual IP detection or runtime spoofing resistance.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://identity-tenancy.internal.example
    description: Host privado ilustrativo; HTTPS directo y nombre validado.
security: []
x-oc-client-signal-policy:
  policy_ref: openapi/identity-gateway-delegation-policy-v2.json#/client_signal
  parameter_ref: '#/components/parameters/OCClientSignal'
  parameter:
    $ref: '#/components/parameters/OCClientSignal'
  applies_to_operation_ids: [registerGlobalAccount, verifyEmail, createSession, completeMfaChallenge, getCurrentSession, logoutCurrentSession, revokeOtherSessions, beginTotpEnrollment, confirmTotpEnrollment, createDeviceRegistrationChallenge, createRegisteredDeviceAuthenticationChallenge, proveRegisteredDevicePossession, registerWebDevice, requestOwnerDeviceSelfApproval, confirmOwnerDeviceSelfApproval, createInitialOrganization, listMyMemberships, selectActiveOrganization, getActiveTenantContext]
  excluded_operation_ids: [getEmailVerificationDeliveryMaterial, getOwnerDeviceApprovalDeliveryMaterial]
tags:
  - name: GatewayDelegation
    description: Delegacion privada de una sesion opaca validada por identity-tenancy.
paths:
  /api/v1/internal/identity/delegations:
    post:
      tags: [GatewayDelegation]
      operationId: createGatewayUserDelegation
      summary: Emite una delegacion privada ligada a una sesion vigente
      description: >-
        Recibe exclusivamente el JWT de servicio de gateway-bff con audiencia
        identity-tenancy.gateway y la cookie opaca vigente de sesion. La
        audiencia de servicio no autoriza operaciones H1 autenticadas; habilita
        registro, verificacion de email, login, completar MFA solo con la misma
        cookie restringida y CSRF, y esta solicitud. La identidad
        valida estado, expiración y referencias de la sesión antes de emitir un
        JWT ES256 type=delegated, caller=gateway-bff, aud
        identity-tenancy.user-api, jti único y exp no posterior a iat + 60 s.
        La delegación no contiene la cookie ni secretos. Si la sesión está
        restringida, no lleva organización, membresía, sucursal, roles,
        permisos ni scopes. El gateway reenvía la cookie solo por HTTPS privado
        junto al delegado para una operación H1 autenticada; identity-tenancy
        vuelve a comprobar sesión y autorización de dominio. No se cachean
        delegaciones entre requests. Respuestas y errores no se cachean.
        A tenant-enabled delegation requires session.device.status=approved,
        a real session.device.device_id, and an identical delegated device_id.
        organization_id and membership_id must both match verified session
        context. A delegated branch_id may be present only when the verified
        session context contains the same branch_id; otherwise it is omitted.
        If a delegated JWT includes device_id for any session, the verified
        session context must contain the identical device_id. Restricted and
        active sessions without tenant context may omit device_id; a restricted
        session with a verified device may include only its matching reference.
      security:
        - gatewayServiceBearer: []
          currentSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/OCClientSignal'
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Delegacion ES256 emitida; nunca contiene cookie ni refresh token.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Pragma:
              $ref: '#/components/headers/NoCache'
          content:
            application/json:
              schema:
                $ref: './identity-gateway-delegation-v2.schema.json#/$defs/DelegationResponse'
              examples:
                restricted_session:
                  externalValue: examples/identity-gateway-delegation-v2-delegation-response-restricted.json
                tenant_session:
                  externalValue: examples/identity-gateway-delegation-v2-delegation-response-tenant.json
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          description: JWT de servicio o sesion ausente, invalido o vencido; no revela cual fallo.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Pragma:
              $ref: '#/components/headers/NoCache'
          content:
            application/problem+json:
              schema:
                $ref: './identity-onboarding-v2.yaml#/components/schemas/Problem'
              examples:
                invalid_or_missing_identity:
                  externalValue: examples/identity-gateway-delegation-v2-problem-unauthorized.json
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/internal/identity/session-rotation-replays:
    post:
      tags: [GatewayDelegation]
      operationId: recoverSessionRotationReplay
      summary: Recupera el resultado exacto de una rotación idempotente
      description: >-
        Operación interna exclusiva para recuperar una respuesta ya confirmada
        de proveRegisteredDevicePossession, confirmOwnerDeviceSelfApproval,
        createInitialOrganization o selectActiveOrganization cuando el gateway
        perdió la respuesta que rotó la credencial. Exige simultáneamente JWT
        service de gateway-bff con audiencia identity-tenancy.gateway, la
        cookie opaca anterior y el mismo Idempotency-Key UUIDv7 de la operación
        original. El body estricto contiene operation_id y original_request;
        este último valida contra el schema de request exacto de esa operación.
        Método y ruta se derivan del operation_id permitido y nunca los elige
        el cliente. La identidad compara operación, clave y fingerprint
        canónico original mediante la versión persistida de su clave HMAC.
        Solo se devuelve el status y body público originales más la nueva
        session_credential en este canal privado. El gateway emite una cookie
        y X-CSRF-Token nuevos ligados a esa credencial; la credencial privada
        jamás se añade al body público. No se repite el efecto ni la auditoría,
        no se extienden los vencimientos y no se emite delegación desde la
        cookie anterior. El resultado solo se recupera mientras la sesión siga
        vigente, la credencial recuperable siga siendo la actual y la
        autorización/aprobación asociadas no hayan cambiado. Cookie no ligada,
        sesión revocada/expirada o autenticación inválida produce el mismo 401
        genérico; resultado expirado, rotación posterior o cambio de
        autorización/estado produce 409 identity_state_or_version_conflict
        sin revelar cuál precondición falló. Misma clave con otra operación o
        carga usa identity_idempotency_key_reused; una reserva aún activa usa
        identity_idempotency_request_in_progress. No se incluye cookie, token,
        fingerprint, solicitud canónica ni credencial en logs, eventos o
        auditoría.
      security:
        - gatewayServiceBearer: []
          previousSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/OCClientSignal'
        - $ref: '#/components/parameters/SessionRotationIdempotencyKey'
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionRotationReplayRequest'
            examples:
              registered_device_possession:
                externalValue: examples/identity-session-rotation-replay-v5-request-prove-device.json
              owner_device_self_approval:
                externalValue: examples/identity-session-rotation-replay-v5-request-confirm-approval.json
              initial_organization:
                externalValue: examples/identity-session-rotation-replay-v5-request-initial-organization.json
              organization_selection:
                externalValue: examples/identity-session-rotation-replay-v5-request-select-organization.json
      responses:
        '200':
          description: Replay exacto; el body/status son los originales. session_credential solo se entrega al gateway autenticado.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
            Pragma: {$ref: '#/components/headers/NoCache'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionRotationReplayResponse'}
              examples:
                registered_device_possession:
                  externalValue: examples/identity-session-rotation-replay-v5-response-prove-device.json
                owner_device_self_approval:
                  externalValue: examples/identity-session-rotation-replay-v5-response-confirm-approval.json
                initial_organization:
                  externalValue: examples/identity-session-rotation-replay-v5-response-initial-organization.json
                organization_selection:
                  externalValue: examples/identity-session-rotation-replay-v5-response-select-organization.json
        '400':
          description: Request estricto mal formado o original_request incompatible con operation_id.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
            Pragma: {$ref: '#/components/headers/NoCache'}
          content:
            application/problem+json:
              schema: {$ref: './identity-onboarding-v2.yaml#/components/schemas/Problem'}
              examples:
                invalid_request:
                  externalValue: examples/identity-session-rotation-replay-v5-problem-invalid-request.json
        '401':
          description: Error genérico; no revela si falló JWT de servicio, cookie anterior o vigencia de sesión.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
            Pragma: {$ref: '#/components/headers/NoCache'}
          content:
            application/problem+json:
              schema: {$ref: './identity-onboarding-v2.yaml#/components/schemas/Problem'}
              examples:
                invalid_or_unbound_identity:
                  externalValue: examples/identity-session-rotation-replay-v5-problem-unauthorized.json
        '409':
          description: Conflicto genérico; los códigos vigentes distinguen idempotencia reutilizada/en curso del conflicto de estado sin exponer detalles sensibles.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
            Pragma: {$ref: '#/components/headers/NoCache'}
          content:
            application/problem+json:
              schema: {$ref: './identity-onboarding-v2.yaml#/components/schemas/Problem'}
              examples:
                key_reused:
                  externalValue: examples/identity-session-rotation-replay-v5-problem-key-reused.json
                request_in_progress:
                  externalValue: examples/identity-session-rotation-replay-v5-problem-in-progress.json
                stale_rotation_result:
                  externalValue: examples/identity-session-rotation-replay-v5-problem-state-conflict.json
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
components:
  securitySchemes:
    gatewayServiceBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        ES256 service token issued by identity-tenancy. Required claims include
        iss must be a URI and exactly match the issuer configured for this environment;
        aud=identity-tenancy.gateway,
        type=service, caller=gateway-bff, canonical UUIDv4 jti and expiry. It does not authorize authenticated
        H1 operations.
    currentSessionCookie:
      type: apiKey
      in: cookie
      name: __Host-oc_session
      description: Cookie opaca vigente de la sesión actual; se transmite solo por HTTPS privado. No acepta la credencial anterior tras una rotación.
    previousSessionCookie:
      type: apiKey
      in: cookie
      name: __Host-oc_session
      description: Cookie opaca anterior a una rotación, usada solo para recuperar el replay exacto; nunca autentica delegaciones ordinarias ni otras operaciones.
  parameters:
    SessionRotationIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUIDv7 original de la operación cuya rotación se recupera; no es una clave nueva de replay.
      schema:
        type: string
        format: uuid
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    Traceparent:
      name: traceparent
      in: header
      required: false
      schema:
        type: string
        pattern: '^[0-9a-f]{2}-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$'
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
    OCClientSignal:
      name: X-OC-Client-Signal
      in: header
      required: false
      description: >-
        The exact syntax declaration is reused by the two documented private
        infrastructure routes as an optional, ignored header; this preserves
        their existing v2.0.5 behavior. The private policy extension makes it
        mandatory for the 19 gateway-to-identity operationIds listed there.
        The value is v1. followed by the canonical
        unpadded base64url encoding of a 32-byte HMAC-SHA-256. gateway-bff
        derives it from the verified public origin (complete IPv4 or IPv6 /64)
        using domain separation and an exclusive CSPRNG secret of at least 32
        bytes. The browser-facing gateway strips any browser-supplied copy
        before deriving it. identity-tenancy authenticates the internal gateway
        JWT before syntax validation only; it neither shares nor verifies the
        HMAC key and does not accept X-Forwarded-* as a substitute. Missing,
        duplicate or malformed values fail closed with generic
        identity_invalid_request. The signal is not authority. Per-purpose
        limits are 10/account and 100/signal in separate 15-minute windows,
        configurable by environment and never by organization. Fixtures prove
        syntax and inventory only, not HMAC, real IP detection or runtime
        spoofing resistance. The two notifications material operations are
        excluded.
      schema:
        type: string
        minLength: 46
        maxLength: 46
        pattern: '^v1\.[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$'
  headers:
    NoStore:
      description: Evita almacenar delegaciones y respuestas de autenticación.
      schema:
        type: string
        const: no-store
    NoCache:
      description: Evita almacenar respuestas de autenticación.
      schema:
        type: string
        const: no-cache
  schemas:
    SessionRotationReplayRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [operation_id, original_request]
          properties:
            operation_id: {const: proveRegisteredDevicePossession}
            original_request: {$ref: './identity-onboarding-v2.yaml#/components/schemas/DeviceAuthenticationProof'}
        - type: object
          additionalProperties: false
          required: [operation_id, original_request]
          properties:
            operation_id: {const: confirmOwnerDeviceSelfApproval}
            original_request: {$ref: './identity-onboarding-v2.yaml#/components/schemas/OwnerDeviceApprovalConfirmation'}
        - type: object
          additionalProperties: false
          required: [operation_id, original_request]
          properties:
            operation_id: {const: createInitialOrganization}
            original_request: {$ref: './identity-onboarding-v2.yaml#/components/schemas/OrganizationOnboardingRequest'}
        - type: object
          additionalProperties: false
          required: [operation_id, original_request]
          properties:
            operation_id: {const: selectActiveOrganization}
            original_request: {$ref: './identity-onboarding-v2.yaml#/components/schemas/ContextSelectionRequest'}
    SessionRotationReplayResponse:
      oneOf:
        - type: object
          additionalProperties: false
          required: [operation_id, public_status, public_body, session_credential, replayed]
          properties:
            operation_id: {const: proveRegisteredDevicePossession}
            public_status: {const: 200}
            public_body: {$ref: './identity-onboarding-v2.yaml#/components/schemas/SessionContext'}
            session_credential: {type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$', x-sensitive: true, description: 'Codificación base64url canónica sin padding de 32 bytes. La forma no demuestra entropía; runtime debe generar los 32 bytes con CSPRNG. Solo respuesta interna autenticada; nunca registrar ni usar el fixture sintético como credencial.'}
            replayed: {const: true}
        - type: object
          additionalProperties: false
          required: [operation_id, public_status, public_body, session_credential, replayed]
          properties:
            operation_id: {const: confirmOwnerDeviceSelfApproval}
            public_status: {const: 200}
            public_body: {$ref: './identity-onboarding-v2.yaml#/components/schemas/DeviceApprovalStatus'}
            session_credential: {type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$', x-sensitive: true, description: 'Codificación base64url canónica sin padding de 32 bytes. La forma no demuestra entropía; runtime debe generar los 32 bytes con CSPRNG. Solo respuesta interna autenticada; nunca registrar ni usar el fixture sintético como credencial.'}
            replayed: {const: true}
        - type: object
          additionalProperties: false
          required: [operation_id, public_status, public_body, session_credential, replayed]
          properties:
            operation_id: {const: createInitialOrganization}
            public_status: {const: 201}
            public_body: {$ref: './identity-onboarding-v2.yaml#/components/schemas/OrganizationOnboardingResponse'}
            session_credential: {type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$', x-sensitive: true, description: 'Codificación base64url canónica sin padding de 32 bytes. La forma no demuestra entropía; runtime debe generar los 32 bytes con CSPRNG. Solo respuesta interna autenticada; nunca registrar ni usar el fixture sintético como credencial.'}
            replayed: {const: true}
        - type: object
          additionalProperties: false
          required: [operation_id, public_status, public_body, session_credential, replayed]
          properties:
            operation_id: {const: selectActiveOrganization}
            public_status: {const: 200}
            public_body: {$ref: './identity-onboarding-v2.yaml#/components/schemas/SessionContext'}
            session_credential: {type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$', x-sensitive: true, description: 'Codificación base64url canónica sin padding de 32 bytes. La forma no demuestra entropía; runtime debe generar los 32 bytes con CSPRNG. Solo respuesta interna autenticada; nunca registrar ni usar el fixture sintético como credencial.'}
            replayed: {const: true}
  responses:
    InvalidRequest:
      description: Solicitud HTTP mal formada.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Pragma:
          $ref: '#/components/headers/NoCache'
      content:
        application/problem+json:
          schema:
            $ref: './identity-onboarding-v2.yaml#/components/schemas/Problem'
    Forbidden:
      description: Dispositivo no aprobado para el contexto solicitado; no se concede delegación tenant.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Pragma:
          $ref: '#/components/headers/NoCache'
      content:
        application/problem+json:
          schema:
            $ref: './identity-onboarding-v2.yaml#/components/schemas/Problem'
          examples:
            delegation_not_allowed:
              externalValue: examples/identity-gateway-delegation-v2-problem-forbidden.json
    Conflict:
      description: La sesión cambió o dejó de coincidir durante la emisión.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Pragma:
          $ref: '#/components/headers/NoCache'
      content:
        application/problem+json:
          schema:
            $ref: './identity-onboarding-v2.yaml#/components/schemas/Problem'
    RateLimited:
      description: Límite temporal excedido.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Pragma:
          $ref: '#/components/headers/NoCache'
      content:
        application/problem+json:
          schema:
            $ref: './identity-onboarding-v2.yaml#/components/schemas/Problem'
    InternalError:
      description: Error interno genérico, sin detalles sensibles.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Pragma:
          $ref: '#/components/headers/NoCache'
      content:
        application/problem+json:
          schema:
            $ref: './identity-onboarding-v2.yaml#/components/schemas/Problem'
    Unavailable:
      description: Dependencia temporalmente no disponible.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Pragma:
          $ref: '#/components/headers/NoCache'
      content:
        application/problem+json:
          schema:
            $ref: './identity-onboarding-v2.yaml#/components/schemas/Problem'
