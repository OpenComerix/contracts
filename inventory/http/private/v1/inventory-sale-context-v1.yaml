        "operationId": "checkInventorySaleContext",
        "summary": "checkInventorySaleContext",
        "description": "No commercial effects or reservations. Fixed ES256 caller/audience, <=300s JWT, no decision caching. Authenticate before existence lookup. Bind tenant, operation, preparation and original human request hash. Preparation <=60s; callbacks revalidate the original human delegate with Identity, held only in Sales request RAM. Missing delegate, restart, revocation or expiry fail closed. Network outside SQL. Decision budget <=2000ms measured monotonically from before network, bounded by credentials/preparation expiry; debit all waits and recheck after locks and before responding. No cross-service SQL. No tenant/header or browser ID grants authority. No guarantee about a later state; acceptance and effect owners recheck their own authority/resources. Obtain fresh Sales callback authority before local consistent RLS read; validate warehouse belongs to organization/branch and the exact location belongs to that warehouse. Optional expected version mismatch is 409; no silent location substitution. No stock quantities or reconciliation grant are returned. context_fingerprint is the lowercase hexadecimal SHA-256 digest of the UTF-8 bytes of RFC 8785 JCS serialization of the complete validated Inventory or Finance sale-context-check request body received by that owner. Include all required fields and all optional fields present, including request_hash unchanged; preserve string values, omission versus null and array order. No substitutions, defaults, coercion or Unicode normalization are permitted. The input is not the callback, decision, result, raw JSON bytes, HTTP headers or credentials; context_fingerprint itself is absent from the owner request body. It is distinct from request_hash, which binds the original normalized human Sales request. Reject invalid requests, duplicate property names and invalid Unicode before hashing.",
