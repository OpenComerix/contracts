        "operationId": "authorizeInventoryCatalogCapture",
        "summary": "authorizeInventoryCatalogCapture",
        "description": "Only catalog-pricing, inventory.catalog-capture-authority. Verify exact preparation <=60s and recheck original human authority with Identity; original delegation only in request RAM. Missing/expired/revoked or restart fails closed. No mutation or general catalog grant. Catalog must validate the complete physical CaptureRequest and compute capture_fingerprint as lowercase SHA-256 of RFC 8785 JCS UTF-8 of that entire body, without normalization or excluding any field. Inventory compares tenant, operation, preparation, original human request_hash, target and capture_fingerprint with its own preparation, then revalidates the original human authority. A changed line, quantity, reference, version or order fails closed; never trust a caller-supplied fingerprint without recomputation. Decision echoes the exact fingerprint and binding. This does not change inventory-request-v1 request_hash. All existing deadlines, RAM-only delegation and no-stock-effect rules remain.",
