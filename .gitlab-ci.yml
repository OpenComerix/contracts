stages:
  - validate

default:
  image: node:24.21.0-bookworm-slim
  interruptible: true

validate:contract-references:
  stage: validate
  script:
    - node scripts/validate-contract-refs.mjs

validate:openapi:
  stage: validate
  variables:
    REDOCLY_TELEMETRY: "off"
    REDOCLY_SUPPRESS_UPDATE_NOTICE: "true"
  script:
    - npx --yes @redocly/cli@2.53.3 lint openapi/pos-sales-v1.yaml openapi/pos-sync-v1.json
    - npx --yes @redocly/cli@2.53.3 lint openapi/identity-onboarding-v1.yaml
    - node scripts/validate-redocly-no-warnings.mjs
    - npx --yes @redocly/cli@2.53.3 bundle openapi/identity-onboarding-v1.yaml --dereferenced --ext json --output /tmp/identity-onboarding-v1.bundle.json
    - node scripts/prepare-identity-rest-fixtures.mjs /tmp/identity-onboarding-v1.bundle.json .ci-artifacts/identity-rest-fixtures --self-test
    - npx --yes @redocly/cli@2.53.3 lint openapi/identity-onboarding-v2.yaml
    - node scripts/validate-redocly-no-warnings.mjs openapi/identity-onboarding-v2.yaml
    - npx --yes @redocly/cli@2.53.3 bundle openapi/identity-onboarding-v2.yaml --dereferenced --ext json --output /tmp/identity-onboarding-v2.bundle.json
    - node scripts/validate-gateway-deadline-exceeded-v5.mjs /tmp/identity-onboarding-v2.bundle.json --self-test
    - node scripts/prepare-identity-rest-fixtures-v2.mjs /tmp/identity-onboarding-v2.bundle.json .ci-artifacts/identity-rest-v2-fixtures --self-test
    - node scripts/prepare-device-registration-challenge-v2.mjs /tmp/identity-onboarding-v2.bundle.json .ci-artifacts/device-registration-challenge-v2 --self-test
    - npx --yes @redocly/cli@2.53.3 lint openapi/identity-internal-auth-v1.yaml
    - node scripts/validate-redocly-no-warnings.mjs openapi/identity-internal-auth-v1.yaml
    - npx --yes @redocly/cli@2.53.3 bundle openapi/identity-internal-auth-v1.yaml --dereferenced --ext json --output /tmp/identity-internal-auth-v1.bundle.json
    - node scripts/prepare-identity-internal-auth-fixtures.mjs /tmp/identity-internal-auth-v1.bundle.json .ci-artifacts/identity-internal-auth-fixtures --self-test
    - npx --yes @redocly/cli@2.53.3 lint openapi/identity-gateway-delegation-v1.yaml
    - node scripts/validate-redocly-no-warnings.mjs openapi/identity-gateway-delegation-v1.yaml
    - npx --yes @redocly/cli@2.53.3 bundle openapi/identity-gateway-delegation-v1.yaml --dereferenced --ext json --output /tmp/identity-gateway-delegation-v1.bundle.json
    - node scripts/validate-gateway-identity-policy.mjs /tmp/identity-onboarding-v1.bundle.json /tmp/identity-gateway-delegation-v1.bundle.json --self-test
    - npx --yes @redocly/cli@2.53.3 lint openapi/identity-gateway-delegation-v2.yaml
    - node scripts/validate-redocly-no-warnings.mjs openapi/identity-gateway-delegation-v2.yaml
    - npx --yes @redocly/cli@2.53.3 bundle openapi/identity-gateway-delegation-v2.yaml --dereferenced --ext json --output /tmp/identity-gateway-delegation-v2.bundle.json
    - node scripts/validate-gateway-identity-policy-v2.mjs /tmp/identity-onboarding-v2.bundle.json /tmp/identity-gateway-delegation-v2.bundle.json --self-test
    - node scripts/validate-client-signal-v1.mjs /tmp/identity-onboarding-v2.bundle.json /tmp/identity-gateway-delegation-v2.bundle.json --self-test
    - node scripts/validate-membership-pagination-v2.mjs /tmp/identity-onboarding-v2.bundle.json --self-test
    - node scripts/validate-error-catalog-v4.mjs /tmp/identity-onboarding-v2.bundle.json --self-test
    - node scripts/validate-csrf-contract-v3.mjs /tmp/identity-onboarding-v2.bundle.json /tmp/identity-gateway-delegation-v2.bundle.json --self-test
    - node scripts/validate-session-rotation-replay-v5.mjs /tmp/identity-onboarding-v2.bundle.json /tmp/identity-gateway-delegation-v2.bundle.json --self-test
    - node scripts/prepare-session-rotation-replay-v5.mjs /tmp/identity-onboarding-v2.bundle.json /tmp/identity-gateway-delegation-v2.bundle.json .ci-artifacts/session-rotation-replay-v5 --self-test
    - node scripts/validate-session-step-up-v1.mjs /tmp/identity-onboarding-v2.bundle.json /tmp/identity-gateway-delegation-v2.bundle.json --self-test
    - node scripts/prepare-session-step-up-v1.mjs /tmp/identity-onboarding-v2.bundle.json /tmp/identity-gateway-delegation-v2.bundle.json .ci-artifacts/session-step-up-v1 --self-test
    - node scripts/prepare-owner-session-flow-v1.mjs /tmp/identity-onboarding-v2.bundle.json .ci-artifacts/owner-session-flow-v1
    - node scripts/validate-owner-session-flow-v1.mjs /tmp/identity-onboarding-v2.bundle.json --self-test
  artifacts:
    paths:
      - .ci-artifacts/identity-rest-fixtures/
      - .ci-artifacts/identity-rest-v2-fixtures/
      - .ci-artifacts/device-registration-challenge-v2/
      - .ci-artifacts/identity-internal-auth-fixtures/
      - .ci-artifacts/session-rotation-replay-v5/
      - .ci-artifacts/session-step-up-v1/
      - .ci-artifacts/owner-session-flow-v1/
    expire_in: 1 day

validate:json-schema:
  stage: validate
  image:
    name: ghcr.io/sourcemeta/jsonschema:v16.10.0
    entrypoint: [""]
  needs:
    - job: validate:openapi
      artifacts: true
  script:
    - jsonschema metaschema events commands/*.schema.json openapi/problem-details-v1.schema.json openapi/problem-details-v2.schema.json openapi/device-proof-v1-vectors.schema.json openapi/identity-gateway-delegation-v2.schema.json openapi/client-signal-v1.schema.json openapi/membership-pagination-v2.schema.json openapi/csrf-v3-problem.schema.json openapi/session-step-up-v1-fixtures.schema.json errors/error-catalog-v1.schema.json errors/error-catalog-v2.schema.json errors/error-catalog-v3.schema.json errors/error-catalog-v4.schema.json errors/error-catalog-v5.schema.json --verbose
    - jsonschema metaschema .ci-artifacts/owner-session-flow-v1/*.schema.json --default-dialect https://json-schema.org/draft/2020-12/schema --verbose
    - jsonschema validate openapi/client-signal-v1.schema.json openapi/client-signal-v1-fixtures.json --verbose
    - jsonschema validate openapi/session-step-up-v1-fixtures.schema.json openapi/session-step-up-v1-fixtures.json --verbose
    - jsonschema validate errors/error-catalog-v1.schema.json errors/error-catalog-v1.json --verbose
    - jsonschema validate errors/error-catalog-v2.schema.json errors/error-catalog-v2.json --verbose
    - jsonschema validate errors/error-catalog-v4.schema.json errors/error-catalog-v4.json --verbose
    - sh scripts/validate-gateway-deadline-exceeded-v5.sh
    - sh scripts/validate-csrf-fixtures-v3.sh
    - jsonschema validate openapi/device-proof-v1-vectors.schema.json openapi/device-proof-v1-vectors.json --verbose
    - jsonschema validate commands/notifications.send-email-verification.v1.schema.json commands/examples/notifications.send-email-verification.v1.example.json --resolve commands/command-envelope-v1.schema.json --verbose
    - jsonschema validate commands/notifications.send-email-verification.result.v1.schema.json commands/examples/notifications.send-email-verification.result.succeeded.v1.example.json commands/examples/notifications.send-email-verification.result.failed-retryable.v1.example.json --resolve commands/command-result-envelope-v1.schema.json --verbose
    - jsonschema validate commands/notifications.send-device-approval.v1.schema.json commands/examples/notifications.send-device-approval.v1.example.json --resolve commands/command-envelope-v1.schema.json --verbose
    - jsonschema validate commands/notifications.send-device-approval.result.v1.schema.json commands/examples/notifications.send-device-approval.result.succeeded.v1.example.json commands/examples/notifications.send-device-approval.result.failed-retryable.v1.example.json --resolve commands/command-result-envelope-v1.schema.json --verbose
    - sh scripts/validate-identity-rest-fixtures.sh .ci-artifacts/identity-rest-fixtures
    - sh scripts/validate-identity-rest-fixtures-v2.sh .ci-artifacts/identity-rest-v2-fixtures
    - sh scripts/validate-device-registration-challenge-v2.sh .ci-artifacts/device-registration-challenge-v2
    - sh scripts/validate-membership-pagination-v2.sh
    - sh scripts/validate-session-rotation-replay-v5.sh .ci-artifacts/session-rotation-replay-v5
    - sh scripts/validate-session-step-up-v1.sh .ci-artifacts/session-step-up-v1
    - sh scripts/validate-owner-session-flow-v1.sh .ci-artifacts/owner-session-flow-v1

validate:internal-auth-schema:
  stage: validate
  image:
    name: ghcr.io/sourcemeta/jsonschema:v16.10.0
    entrypoint: [""]
  needs:
    - job: validate:openapi
      artifacts: true
  script:
    - jsonschema metaschema .ci-artifacts/identity-internal-auth-fixtures/schema-*.json --verbose
    - sh scripts/validate-identity-internal-auth-fixtures.sh .ci-artifacts/identity-internal-auth-fixtures

validate:identity-checklist:
  stage: validate
  script:
    - node scripts/validate-contract-refs.mjs --self-test
    - node scripts/validate-identity-onboarding.mjs --self-test
    - node scripts/validate-device-proof-vectors.mjs
    - node --check scripts/validate-client-signal-v1.mjs
    - node --check scripts/validate-session-rotation-replay-v5.mjs
    - node --check scripts/session-step-up-v1-common.mjs
    - node --check scripts/prepare-session-step-up-v1.mjs
    - node --check scripts/validate-session-step-up-v1.mjs
    - node --check scripts/prepare-session-rotation-replay-v5.mjs
    - sh -n scripts/validate-session-rotation-replay-v5.sh
    - sh -n scripts/validate-session-step-up-v1.sh

validate:gateway-delegation-schema:
  stage: validate
  image:
    name: ghcr.io/sourcemeta/jsonschema:v16.10.0
    entrypoint: [""]
  script:
    - jsonschema metaschema openapi/identity-gateway-delegation-v1.schema.json --verbose
    - sh scripts/validate-gateway-delegation-schemas.sh
    - jsonschema metaschema openapi/identity-gateway-delegation-v2.schema.json --verbose
    - sh scripts/validate-gateway-delegation-v2-schemas.sh

validate:contract-architecture:
  stage: validate
  variables:
    GIT_DEPTH: "0"
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git ca-certificates
    - corepack enable
    - corepack prepare pnpm@12.4.2 --activate
    - pnpm install --frozen-lockfile
  script:
    - pnpm test:architecture
    - pnpm registry:check
    - pnpm contracts:consumers
    - pnpm contracts:impact --output .ci-artifacts/contract-impact.json
  artifacts:
    when: always
    paths:
      - .ci-artifacts/contract-impact.json
    expire_in: 7 days

validate:contract-metadata-schema:
  stage: validate
  image:
    name: ghcr.io/sourcemeta/jsonschema:v16.10.0
    entrypoint: [""]
  script:
    - jsonschema metaschema registry/manifest-v1.schema.json registry/lock-v1.schema.json --verbose

validate:catalog-contracts:
  stage: validate
  variables:
    GIT_DEPTH: "0"
    REDOCLY_TELEMETRY: "off"
    REDOCLY_SUPPRESS_UPDATE_NOTICE: "true"
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git ca-certificates
    - corepack enable
    - corepack prepare pnpm@12.4.2 --activate
    - pnpm install --frozen-lockfile
  script:
    - node --test test/catalog/*.test.mjs
    - npx --yes @redocly/cli@2.53.3 lint identity/http/private/v1/identity-catalog-authority-v1.yaml catalog/http/public/v1/catalog-pricing-v1.yaml catalog/http/private/v1/catalog-pricing-internal-v1.yaml
    - node scripts/validate-redocly-no-warnings.mjs identity/http/private/v1/identity-catalog-authority-v1.yaml
    - node scripts/validate-redocly-no-warnings.mjs catalog/http/public/v1/catalog-pricing-v1.yaml
    - node scripts/validate-redocly-no-warnings.mjs catalog/http/private/v1/catalog-pricing-internal-v1.yaml
    - npx --yes @redocly/cli@2.53.3 bundle identity/http/private/v1/identity-catalog-authority-v1.yaml --dereferenced --ext json --output .ci-artifacts/catalog-authority-v1.bundle.json
    - npx --yes @redocly/cli@2.53.3 bundle catalog/http/public/v1/catalog-pricing-v1.yaml --dereferenced --ext json --output .ci-artifacts/catalog-public-v1.bundle.json
    - npx --yes @redocly/cli@2.53.3 bundle catalog/http/private/v1/catalog-pricing-internal-v1.yaml --dereferenced --ext json --output .ci-artifacts/catalog-private-v1.bundle.json
    - node scripts/catalog/validate-security-v1.mjs .ci-artifacts/catalog-authority-v1.bundle.json .ci-artifacts/catalog-security-v1 --self-test
    - node scripts/catalog/validate-http-v1.mjs .ci-artifacts/catalog-public-v1.bundle.json .ci-artifacts/catalog-private-v1.bundle.json .ci-artifacts/catalog-http-v1 --self-test
    - node scripts/catalog/validate-pricing-http-v1.mjs .ci-artifacts/catalog-public-v1.bundle.json .ci-artifacts/catalog-private-v1.bundle.json .ci-artifacts/catalog-pricing-v1 --self-test
    - node scripts/catalog/validate-events-v1.mjs .ci-artifacts/catalog-events-v1 --self-test
    - node scripts/catalog/validate-history-policy-v1.mjs .ci-artifacts/catalog-history-policy-v1 --self-test
    - npx --yes @redocly/cli@2.53.3 lint catalog/http/private/v1/catalog-history-protection-v1.yaml
    - node scripts/validate-redocly-no-warnings.mjs catalog/http/private/v1/catalog-history-protection-v1.yaml
    - npx --yes @redocly/cli@2.53.3 bundle catalog/http/private/v1/catalog-history-protection-v1.yaml --dereferenced --ext json --output .ci-artifacts/catalog-history-protection-v1.bundle.json
    - node scripts/catalog/validate-history-protection-v1.mjs .ci-artifacts/catalog-history-protection-v1 --self-test
    - npx --yes @redocly/cli@2.53.3 lint identity/http/private/v1/identity-catalog-recovery-authority-v1.yaml
    - node scripts/validate-redocly-no-warnings.mjs identity/http/private/v1/identity-catalog-recovery-authority-v1.yaml
    - npx --yes @redocly/cli@2.53.3 bundle identity/http/private/v1/identity-catalog-recovery-authority-v1.yaml --dereferenced --ext json --output .ci-artifacts/catalog-recovery-authority-v1.bundle.json
    - node scripts/identity/validate-catalog-recovery-authority-v1.mjs .ci-artifacts/catalog-recovery-authority-v1
    - npx --yes @redocly/cli@2.53.3 lint catalog/http/private/v1/catalog-history-recovery-v1.yaml
    - node scripts/validate-redocly-no-warnings.mjs catalog/http/private/v1/catalog-history-recovery-v1.yaml
    - npx --yes @redocly/cli@2.53.3 bundle catalog/http/private/v1/catalog-history-recovery-v1.yaml --dereferenced --ext json --output .ci-artifacts/catalog-history-recovery-v1.bundle.json
    - npx --yes @redocly/cli@2.53.3 lint identity/http/private/v2/identity-catalog-recovery-verification-v2.yaml
    - node scripts/validate-redocly-no-warnings.mjs identity/http/private/v2/identity-catalog-recovery-verification-v2.yaml
    - npx --yes @redocly/cli@2.53.3 bundle identity/http/private/v2/identity-catalog-recovery-verification-v2.yaml --dereferenced --ext json --output .ci-artifacts/catalog-recovery-verification-v2.bundle.json
    - node scripts/identity/validate-catalog-recovery-verification-v2.mjs .ci-artifacts/catalog-recovery-verification-v2
    - node scripts/catalog/validate-history-recovery-v1.mjs .ci-artifacts/catalog-history-recovery-v1 --self-test
    - node scripts/catalog/validate-history-policy-v2.mjs .ci-artifacts/catalog-history-policy-v2 --self-test
  artifacts:
    paths:
      - .ci-artifacts/catalog-authority-v1.bundle.json
      - .ci-artifacts/catalog-public-v1.bundle.json
      - .ci-artifacts/catalog-private-v1.bundle.json
      - .ci-artifacts/catalog-security-v1/
      - .ci-artifacts/catalog-http-v1/
      - .ci-artifacts/catalog-pricing-v1/
      - .ci-artifacts/catalog-events-v1/
      - .ci-artifacts/catalog-history-policy-v1/
      - .ci-artifacts/catalog-history-protection-v1/
      - .ci-artifacts/catalog-history-protection-v1.bundle.json
      - .ci-artifacts/catalog-recovery-authority-v1.bundle.json
      - .ci-artifacts/catalog-recovery-authority-v1/
      - .ci-artifacts/catalog-history-recovery-v1.bundle.json
      - .ci-artifacts/catalog-history-recovery-v1/
      - .ci-artifacts/catalog-recovery-verification-v2.bundle.json
      - .ci-artifacts/catalog-recovery-verification-v2/
      - .ci-artifacts/catalog-history-policy-v2/
    expire_in: 1 day

validate:catalog-schema:
  stage: validate
  image:
    name: ghcr.io/sourcemeta/jsonschema:v16.10.0
    entrypoint: [""]
  needs:
    - job: validate:catalog-contracts
      artifacts: true
  script:
    - jsonschema metaschema catalog/http/shared/v1/*.schema.json identity/http/private/v1/identity-catalog-authority-v1.schema.json common/http/shared/v3/problem-details-v3.schema.json common/errors/v6/error-catalog-v6.schema.json catalog/events/v1/*.schema.json --verbose
    - jsonschema metaschema identity/http/shared/v1/identity-catalog-recovery-authority-v1.schema.json --verbose
    - sh scripts/identity/validate-catalog-recovery-authority-v1.sh .ci-artifacts/catalog-recovery-authority-v1
    - jsonschema validate common/errors/v6/error-catalog-v6.schema.json common/errors/v6/error-catalog-v6.json --format-assertion --verbose
    - sh scripts/catalog/validate-security-v1.sh .ci-artifacts/catalog-security-v1
    - sh scripts/catalog/validate-security-v1.sh .ci-artifacts/catalog-http-v1
    - sh scripts/catalog/validate-security-v1.sh .ci-artifacts/catalog-pricing-v1
    - sh scripts/catalog/validate-security-v1.sh .ci-artifacts/catalog-events-v1
    - jsonschema metaschema common/http/shared/v1/data-lifecycle-policy-v1.schema.json --verbose
    - jsonschema validate common/http/shared/v1/data-lifecycle-policy-v1.schema.json catalog/http/shared/v1/catalog-history-policy-v1.json --format-assertion --verbose
    - sh scripts/catalog/validate-security-v1.sh .ci-artifacts/catalog-history-policy-v1
    - jsonschema metaschema common/errors/v7/error-catalog-v7.schema.json --verbose
    - jsonschema validate common/errors/v7/error-catalog-v7.schema.json common/errors/v7/error-catalog-v7.json --format-assertion --verbose
    - sh scripts/catalog/validate-security-v1.sh .ci-artifacts/catalog-history-protection-v1
    - jsonschema metaschema common/errors/v8/error-catalog-v8.schema.json --verbose
    - jsonschema validate common/errors/v8/error-catalog-v8.schema.json common/errors/v8/error-catalog-v8.json --format-assertion --verbose
    - sh scripts/catalog/validate-security-v1.sh .ci-artifacts/catalog-history-recovery-v1
    - jsonschema metaschema identity/http/shared/v2/identity-catalog-recovery-verification-v2.schema.json --verbose
    - sh scripts/catalog/validate-security-v1.sh .ci-artifacts/catalog-recovery-verification-v2
    - jsonschema metaschema common/http/shared/v2/data-lifecycle-policy-v2.schema.json --verbose
    - jsonschema validate common/http/shared/v2/data-lifecycle-policy-v2.schema.json catalog/http/shared/v2/catalog-history-policy-v2.json --format-assertion --verbose
    - sh scripts/catalog/validate-security-v1.sh .ci-artifacts/catalog-history-policy-v2

validate:identity-catalog-contracts:
  stage: validate
  variables:
    GIT_DEPTH: "0"
    REDOCLY_TELEMETRY: "off"
    REDOCLY_SUPPRESS_UPDATE_NOTICE: "true"
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git ca-certificates
    - corepack enable
    - corepack prepare pnpm@12.4.2 --activate
    - pnpm install --frozen-lockfile
  script:
    - node --test test/identity/*.test.mjs
    - npx --yes @redocly/cli@2.53.3 lint identity/http/private/v1/identity-catalog-history-permissions-v1.yaml
    - node scripts/validate-redocly-no-warnings.mjs identity/http/private/v1/identity-catalog-history-permissions-v1.yaml
    - npx --yes @redocly/cli@2.53.3 bundle identity/http/private/v1/identity-catalog-history-permissions-v1.yaml --dereferenced --ext json --output .ci-artifacts/catalog-history-permissions-v1.bundle.json
    - node scripts/identity/validate-catalog-history-permissions-v1.mjs .ci-artifacts/catalog-history-permissions-v1 .ci-artifacts/catalog-history-permissions-v1.bundle.json
    - node scripts/identity/validate-catalog-workload-profiles-v1.mjs
  artifacts:
    paths:
      - .ci-artifacts/catalog-history-permissions-v1.bundle.json
      - .ci-artifacts/catalog-history-permissions-v1/
    expire_in: 1 day

validate:identity-catalog-schema:
  stage: validate
  image:
    name: ghcr.io/sourcemeta/jsonschema:v16.10.0
    entrypoint: [""]
  needs:
    - job: validate:identity-catalog-contracts
      artifacts: true
  script:
    - jsonschema metaschema identity/http/shared/v1/identity-catalog-history-permissions-v1.schema.json --verbose
    - sh scripts/catalog/validate-security-v1.sh .ci-artifacts/catalog-history-permissions-v1
