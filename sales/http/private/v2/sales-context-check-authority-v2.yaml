        "operationId": "authorizeSaleContextCheck",
        "summary": "authorizeSaleContextCheck",
        "description": "No commercial effects or reservations. Fixed ES256 caller/audience, <=300s JWT, no decision caching. Authenticate before existence lookup. Bind tenant, operation, preparation and original human request hash. For ID-04 finalizeOnlineSale only, Sales obtains a fresh Identity decision before looking up or returning an accepted replay. For a new intention, an authenticated read-only preparation callback can use only the remaining entry decision budget for the exact attempt in its Sales instance. Authenticate the workload caller and fixed audience before preparation lookup. Bind the exact caller, audience, organization, operation, preparation, human request hash, owner request fingerprint, operator, membership, session, device, permission and branch/POS scope. The entry decision and original delegate stay in private Sales request RAM. Deny without disclosing existence when a binding differs, the preparation is missing or canceled, the instance is lost, or any budget or credential expires. The preparation lifetime is at most 60 s. The entry deadline is monotonic from before the Identity call and at most 2000 ms. The effective limit is the earliest of the entry budget and applicable credential and preparation expiries. Network and waits consume the same budget. Sales and the owner recheck after waits and before replying; a callback or read result cannot extend that deadline. A revocation during this window can allow a bound read to complete. Sales obtains a second fresh Identity decision before persisting a new intention. The final decision must bind the original human request and the same operator, membership, session, device, tenant and authorized scope. Check its budget and the source result budgets after waits and before commit. If Identity observes a revocation or the final decision is missing, denied or stale, the attempt creates no intention or stock or cash commands. Identity calls occur outside SQL locks. Enable ID-04 only for the compatible Sales, Catalog, Inventory and Finance cohort. The published predecessor contract continues to govern its current consumers. Network outside SQL. Decision budget <=2000ms measured monotonically from before network, bounded by credentials/preparation expiry; debit all waits and recheck after locks and before responding. No cross-service SQL. No tenant/header or browser ID grants authority. No guarantee about a later state; acceptance and effect owners recheck their own authority/resources. Compare target to authenticated caller and the fingerprint stored for that owner; check sales.finalize and the exact authorized branch/POS in the bounded entry decision before returning original actor references. The callback body contains no delegated JWT, cookie, permission flag or resource payload. Unknown/expired/mismatched preparations return the same closed result without owner resource lookup. context_fingerprint is the lowercase hexadecimal SHA-256 digest of the UTF-8 bytes of RFC 8785 JCS serialization of the complete validated Inventory or Finance sale-context-check request body received by that owner. Include all required fields and all optional fields present, including request_hash unchanged; preserve string values, omission versus null and array order. No substitutions, defaults, coercion or Unicode normalization are permitted. The input is not the callback, decision, result, raw JSON bytes, HTTP headers or credentials; context_fingerprint itself is absent from the owner request body. It is distinct from request_hash, which binds the original normalized human Sales request. Reject invalid requests, duplicate property names and invalid Unicode before hashing.",
