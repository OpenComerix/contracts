        "operationId": "authorizeSaleCatalogCapture",
        "summary": "authorizeSaleCatalogCapture",
        "description": "Only catalog-pricing. Bind tenant/operation/preparation/request hash and SHA-256 JCS of the complete capture request. For ID-04 finalizeOnlineSale only, Sales obtains a fresh Identity decision before looking up or returning an accepted replay. For a new intention, an authenticated read-only preparation callback can use only the remaining entry decision budget for the exact attempt in its Sales instance. Authenticate the workload caller and fixed audience before preparation lookup. Bind the exact caller, audience, organization, operation, preparation, human request hash, owner request fingerprint, operator, membership, session, device, permission and branch/POS scope. The entry decision and original delegate stay in private Sales request RAM. Deny without disclosing existence when a binding differs, the preparation is missing or canceled, the instance is lost, or any budget or credential expires. The preparation lifetime is at most 60 s. The entry deadline is monotonic from before the Identity call and at most 2000 ms. The effective limit is the earliest of the entry budget and applicable credential and preparation expiries. Network and waits consume the same budget. Sales and the owner recheck after waits and before replying; a callback or read result cannot extend that deadline. A revocation during this window can allow a bound read to complete. Sales obtains a second fresh Identity decision before persisting a new intention. The final decision must bind the original human request and the same operator, membership, session, device, tenant and authorized scope. Check its budget and the source result budgets after waits and before commit. If Identity observes a revocation or the final decision is missing, denied or stale, the attempt creates no intention or stock or cash commands. Identity calls occur outside SQL locks. Enable ID-04 only for the compatible Sales, Catalog, Inventory and Finance cohort. The published predecessor contract continues to govern its current consumers.",
