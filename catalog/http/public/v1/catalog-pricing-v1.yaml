    patch:
      operationId: updateCatalogProduct
      summary: updateCatalogProduct
      tags:
        - Catalog
      description:
        Expected product version. Partial default_variant is explicit. Base-unit change
        additionally requires expected_base_presentation_version and sole never-activated draft base
        presentation; both versions increment atomically. Type fixed after first activation. Active
        fiscal change needs fresh step-up. Retired SKU/PLU remain reserved. All responses no-store.
        Gateway validates public cookie/Origin/CSRF; trusted private request uses delegated token
        and X-OC-Client-Signal. Identity revalidates current authority <=2000ms, checked before
        reads/replays and after locks before commit; no distributed atomicity claimed.
        Idempotency-Key UUIDv7 required; replay original status/body/Location/version for 7 days
        with current authority, no cookie rotation. Unknown/duplicate fields rejected;
        validate/normalize before catalog-request-v1 JCS.
      security:
        - sessionCookie: []
      x-permission: catalog.manage
      x-internal: false
      parameters:
        - name: product_id
          in: path
