    post:
      operationId: createPresentationPrice
      summary: createPresentationPrice
      tags:
        - Pricing
      description: Only amount and expected_version. Expected0 denotes absence; first version1. Per
        organization/presentation/default-list sequence independent of catalog versions. Server
        immediately closes previous valid_to and creates prospective version at same UTC instant
        [valid_from,valid_to); never rewrite earlier amount/version or accept client
        timestamps/scheduling. First price creates unique default list in same local transaction;
        failure leaves neither partial list nor price. Product/presentation remain unchanged;
        discontinued forbids new prices. Never activate as side effect. Return201 and consultable
        /api/v1/pricing/prices/{price_id}. No If-Match. Replay preserves original
        status/body/Location/version/validity/ETag even when persisted historical record was
        subsequently closed; only Idempotency-Replayed changes. Transaction/SQL concurrency belong
        to future owner. All responses no-store. Public session cookie; mutation Origin/CSRF
        validated by gateway. Private ES256 aud catalog-pricing.user-api, gateway-bff caller, type
        delegated <=60s and trusted X-OC-Client-Signal. Current identity authority checked before
        reads/replays and after SQL locks before commit, <=2000ms from before request; no cached
        authority or distributed atomicity. Idempotency-Key UUIDv7;7 days; no automatic retry after
        uncertain result. Reject unknown/duplicate fields; validate scale before decimal
        normalization/catalog-request-v1 JCS.
      security:
        - sessionCookie: []
      x-permission: pricing.manage
      x-internal: false
      parameters:
        - name: presentation_id
          in: path
          required: true
          schema:
            $ref: ../../shared/v1/catalog-common-v1.schema.json#/$defs/CatalogId
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            $ref: ../../shared/v1/catalog-common-v1.schema.json#/$defs/IdempotencyKey
        - name: Origin
          in: header
          required: true
          schema:
            type: string
            format: uri
          description: Exact allowed origin verified by gateway.
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          description: Session-bound CSRF verified by gateway; never private browser tokens.
      responses:
        "201":
          description: Successful createPresentationPrice
          headers:
            Cache-Control:
              required: true
              schema:
                $ref: ../../shared/v1/catalog-common-v1.schema.json#/$defs/CacheControl
