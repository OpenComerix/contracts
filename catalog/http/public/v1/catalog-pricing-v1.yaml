  /pricing/prices/{price_id}:
    get:
      operationId: getPrice
      summary: getPrice
      tags:
        - Pricing
      description: "Read immutable historical amount/version by price_id within current organization,
        including its actual interval. Closing valid_to changes representation ETag without
        incrementing historical version. History remains available after product discontinuation.
        All responses no-store. Public session cookie; mutation Origin/CSRF validated by gateway.
        Private ES256 aud catalog-pricing.user-api, gateway-bff caller, type delegated <=60s and
        trusted X-OC-Client-Signal. Current identity authority checked before reads/replays and
        after SQL locks before commit, <=2000ms from before request; no cached authority or
        distributed atomicity. "
      security:
        - sessionCookie: []
      x-permission: pricing.read
      x-internal: false
      parameters:
        - name: price_id
          in: path
          required: true
          schema:
            $ref: ../../shared/v1/catalog-common-v1.schema.json#/$defs/CatalogId
      responses:
