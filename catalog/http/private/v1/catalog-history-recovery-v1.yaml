openapi: 3.1.0
info:
  title: OpenComerix Catalog History Recovery API
  version: 1.0.0
  description: F1-08G/R4 candidate only. Two private owner operations; fresh R3 authority is mandatory on every
    request, including retries, through POST /internal/v2/identity/catalog/recovery-grants/verify. No runtime, admission, PWA, broker, temporary files, republishing or
    additional reader is enabled.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://catalog-pricing.internal.example
    description: Illustrative private HTTPS host.
tags:
  - name: CatalogHistoryRecovery
    description: Exceptional retained-original history recovery.
security:
  - recoveryWorkloadBearer: []
paths:
  /internal/v1/catalog/history/recoveries:
    post:
      operationId: createCatalogHistoryRecovery
      tags:
        - CatalogHistoryRecovery
      summary: Create or retry an idempotent recovery
      description: "The UUIDv7 recovery_id is a caller intent, never authority. Revalidate H1A and the exact R3
        binding/grant before lookup or replay. R3 session_id remains the authenticated person's session;
        recovery_id is distinct. Only exceptional-history-recovery/catalog.history.recover is accepted. On a
        missing session, UUID time must be between issued_at from the fresh trusted identity v2 VerifyResponse and server now; reject old intent
        as 410, including after 24h metadata purge, and future intent as 400. For an existing owned session
        skip that creation-time window, compare binding and after_position exactly (object key order
        irrelevant, array order preserved), and preserve original cut/times; a renewed current grant may
        replace its reference without broadening the binding. Do not include grant_reference in the immutable
        intent fingerprint or store it in metadata. Atomically serialize same-intent creation and tenant
        session-slot admission: 201 only for the winner, 200 for replay, never two cuts/sessions. Take the
        confirmed per-tenant high-water cut and coverage in one SQL view; after_position must not exceed cut.
        New sessions expire in one absolute hour, without renewal. At most two active sessions per tenant;
        replay does not allocate another slot. Completed replay returns completed state and null
        initial_cursor. Metadata and hashes expire exactly 24h after original close or expiry; audit/history
        follow separate policies. Source uncertainty is not an empty complete history. Deadline 10s including
        body; request <=128 KiB UTF-8; no plan distinction."
      x-internal: true
      x-workload:
        caller: catalog-pricing
        audience: catalog-pricing.history-recovery
        type: service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../shared/v1/catalog-history-recovery-protocol-v1.schema.json#/$defs/CreateRequest
      responses:
        "200":
          description: Same session/cut/times; optional fresh initial handle does not reopen or extend it.
          headers:
            Cache-Control: &a1
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: ../../shared/v1/catalog-history-recovery-protocol-v1.schema.json#/$defs/Session
        "201":
          description: New session with fixed cut and absolute expiry.
          headers:
            Cache-Control: *a1
          content:
            application/json:
              schema:
                $ref: ../../shared/v1/catalog-history-recovery-protocol-v1.schema.json#/$defs/Session
        "400": &a2
          description: Malformed request or altered/unknown cursor; no position disclosure.
          headers:
            Cache-Control: *a1
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: ../../shared/v1/catalog-history-recovery-protocol-v1.schema.json#/$defs/Problem
                  - properties:
                      status:
                        const: 400
        "401": &a3
          description: Workload authentication invalid.
          headers:
            Cache-Control: *a1
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: ../../shared/v1/catalog-history-recovery-protocol-v1.schema.json#/$defs/Problem
                  - properties:
                      status:
                        const: 401
        "403": &a4
          description: Fresh recovery authority unavailable or insufficient; no grant details.
          headers:
            Cache-Control: *a1
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: ../../shared/v1/catalog-history-recovery-protocol-v1.schema.json#/$defs/Problem
                  - properties:
                      status:
                        const: 403
        "404": &a5
          description: Uniform unknown recovery or foreign tenant/workload.
          headers:
            Cache-Control: *a1
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: ../../shared/v1/catalog-history-recovery-protocol-v1.schema.json#/$defs/Problem
                  - properties:
                      status:
                        const: 404
        "406": &a6
          description: Representation not acceptable.
          headers:
            Cache-Control: *a1
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: ../../shared/v1/catalog-history-recovery-protocol-v1.schema.json#/$defs/Problem
                  - properties:
                      status:
                        const: 406
        "409": &a7
          description: Intent, binding, cut or closed-session conflict.
          headers:
            Cache-Control: *a1
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: ../../shared/v1/catalog-history-recovery-protocol-v1.schema.json#/$defs/Problem
                  - properties:
                      status:
                        const: 409
        "410": &a8
          description: Owned recovery/cursor expired or unsupported cursor version.
          headers:
            Cache-Control: *a1
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: ../../shared/v1/catalog-history-recovery-protocol-v1.schema.json#/$defs/Problem
                  - properties:
                      status:
                        const: 410
        "413": &a9
          description: Request exceeds 128 KiB UTF-8.
          headers:
            Cache-Control: *a1
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: ../../shared/v1/catalog-history-recovery-protocol-v1.schema.json#/$defs/Problem
                  - properties:
                      status:
                        const: 413
        "415": &a10
          description: Only application/json requests are accepted.
          headers:
            Cache-Control: *a1
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: ../../shared/v1/catalog-history-recovery-protocol-v1.schema.json#/$defs/Problem
                  - properties:
                      status:
                        const: 415
        "429": &a11
          description: Technical concurrency/rate saturation; retry the same intent after Retry-After.
          headers:
            Cache-Control: *a1
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: ../../shared/v1/catalog-history-recovery-protocol-v1.schema.json#/$defs/Problem
                  - properties:
                      status:
                        const: 429
        "500": &a12
          description: Unexpected internal failure without protected content.
          headers:
            Cache-Control: *a1
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: ../../shared/v1/catalog-history-recovery-protocol-v1.schema.json#/$defs/Problem
                  - properties:
                      status:
                        const: 500
        "503": &a13
          description: Authority/source unavailable, integrity unverified or original event not representable.
          headers:
            Cache-Control: *a1
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: ../../shared/v1/catalog-history-recovery-protocol-v1.schema.json#/$defs/Problem
                  - properties:
                      status:
                        const: 503
  /internal/v1/catalog/history/recoveries/{recovery_id}/pages:
    post:
      operationId: readCatalogHistoryRecoveryPage
      tags:
        - CatalogHistoryRecovery
      summary: Read or retry one recovery page
      description: "Cursor and grant are carried only in the body, never URLs or logs. Revalidate workload and R3
        authority first. Unknown/foreign sessions return uniform 404; check ownership before 410
        expiry/version errors. Cursor is an opaque ocrc1_ plus 32 CSPRNG bytes encoded canonical unpadded
        base64url; store SHA-256 only, linked through CursorMetadata to
        session/tenant/workload/binding/cut/position/version and the unchanged session expiry. There are no
        cursor signing/encryption keys; H1A credentials retain their own key lifecycle. Never put claims or
        event payloads inside the token. A valid cursor never authorizes access. Read retained original events
        after cursor position through fixed cut in ascending transactional tenant order. Selection uses exact
        R3 aggregate_types, aggregate_ids and aggregate versions (empty ID/version lists mean all); positions
        are decimal strings, never JavaScript Number. Preserve original IDs, revisions, instants, snapshots
        and values without reconstruction or normalization. A page can scan unselected known facts and
        therefore advance with no events. Default 100 events, max 500; at most 500 available+missing ranges
        per page; total UTF-8 response <=1 MiB including all metadata, original event <=128 KiB. Stop before a
        whole event/range if needed; an original that cannot fit is an explicit error, never truncated. Page
        gaps are positive inclusive nonoverlapping ranges that partition the scanned interval together with
        available_ranges; available ranges describe known retained source positions, including unselected
        facts. Disposed ranges conservatively reduce coverage even if their old selection match cannot be
        proved. Reasons are disposed with policy/version, or before_supported_frontier without a fabricated
        policy. Missing/unaccounted-for positions at/after the frontier are unverifiable integrity, 503. Each
        page recomputes global requested coverage and scanned-segment details with facts in the same SQL view;
        no open transaction or history pin between requests. Global status may be complete before traversal
        finishes, but complete=true requires both end_of_traversal and global complete coverage. Finishing
        releases the active slot; it does not acknowledge delivery or extend any expiry. A completed session
        allows only replay of its original terminal after-position and limit until absolute expiry; retain
        only that terminal metadata, not response/event copies. If current disposal or fragmentation prevents
        this terminal replay from reaching cut within budgets, reject it as catalog_recovery_closed (409),
        without any page or next cursor; a new authorized recovery_id is required. Replaying a cursor rereads current retained
        history: disposal can change events/coverage and the next handle, never cut/expiry or previously valid
        handles. Deduplicate by original IDs; no promise of byte-identical page replay. One page in flight per
        session, five page requests/second/tenant; retries count. Saturation returns 429 with Retry-After.
        Deadline 10s including body, serialization and final authority/expiry check before data delivery. No
        plan-dependent quotas, no total history cap."
      x-internal: true
      x-workload:
        caller: catalog-pricing
        audience: catalog-pricing.history-recovery
        type: service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../shared/v1/catalog-history-recovery-protocol-v1.schema.json#/$defs/PageRequest
      responses:
        "200":
          description: Original retained facts, current coverage and distinct traversal/completeness flags.
          headers:
            Cache-Control: *a1
          content:
            application/json:
              schema:
                $ref: ../../shared/v1/catalog-history-recovery-protocol-v1.schema.json#/$defs/Page
        "400": *a2
        "401": *a3
        "403": *a4
        "404": *a5
        "406": *a6
        "409": *a7
        "410": *a8
        "413": *a9
        "415": *a10
        "429": *a11
        "500": *a12
        "503": *a13
      parameters:
        - name: recovery_id
          in: path
          required: true
          description: Owned recovery identifier; never a credential.
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
components:
  securitySchemes:
    recoveryWorkloadBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: H1A ES256 service credential. Validate issuer, algorithm, kid, type, caller, exclusive audience,
        iat/exp and maximum 300s; not user delegation or the opaque R3 grant.
  headers:
    NoStore:
      required: true
      description: Never cache recovery data or errors.
      schema:
        const: no-store
        type: string
    RetryAfter:
      required: true
      description: Positive whole seconds until a safe retry of the same request.
      schema:
        type: string
        pattern: ^[1-9][0-9]*$
