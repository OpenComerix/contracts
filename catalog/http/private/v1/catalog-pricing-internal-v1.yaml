  /catalog/presentations/{presentation_id}/barcodes/{barcode_id}/retire:
    post:
      operationId: retireCatalogPresentationBarcode
      summary: retireCatalogPresentationBarcode
      tags:
        - Catalog
      description:
        Retires exact barcode of the path presentation, preserves reservation and history. No
        silent reassignment/reactivation. Returns affected barcode with updated presentation. All
        responses no-store. Gateway validates public cookie/Origin/CSRF; trusted private request
        uses delegated token and X-OC-Client-Signal. Identity revalidates current authority
        <=2000ms, checked before reads/replays and after locks before commit; no distributed
        atomicity claimed. Idempotency-Key UUIDv7 required; replay original
        status/body/Location/version for 7 days with current authority, no cookie rotation.
        Unknown/duplicate fields rejected; validate/normalize before catalog-request-v1 JCS.
      security:
        - delegatedBearer: []
      x-permission: catalog.manage
      x-internal: true
      parameters:
        - name: presentation_id
          in: path
          required: true
          schema:
            $ref: ../../shared/v1/catalog-common-v1.schema.json#/$defs/CatalogId
        - name: barcode_id
          in: path
          required: true
          schema:
            $ref: ../../shared/v1/catalog-common-v1.schema.json#/$defs/CatalogId
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            $ref: ../../shared/v1/catalog-common-v1.schema.json#/$defs/IdempotencyKey
        - name: X-OC-Client-Signal
          in: header
          required: true
          schema:
            $ref: ../../shared/v1/catalog-common-v1.schema.json#/$defs/ClientSignal
          description: Trusted gateway derived; never grants authority or enters public hash.
      responses:
        "200":
          description: Successful retireCatalogPresentationBarcode
          headers:
            Cache-Control:
              required: true
              schema:
                $ref: ../../shared/v1/catalog-common-v1.schema.json#/$defs/CacheControl
            ETag:
              required: true
              schema:
                $ref: ../../shared/v1/catalog-common-v1.schema.json#/$defs/ETag
            Idempotency-Replayed:
              required: true
              schema:
                $ref: ../../shared/v1/catalog-common-v1.schema.json#/$defs/IdempotencyReplayed
          content:
            application/json:
              schema:
                $ref: ../../shared/v1/catalog-entities-v1.schema.json#/$defs/BarcodeResult
              examples:
                valid:
                  externalValue: ../../../fixtures/http/v1/retireCatalogPresentationBarcode-success.json
                replay:
                  externalValue: ../../../fixtures/http/v1/retireCatalogPresentationBarcode-success.json
