      description:
        Catalog-owned createCatalogCategory. Versioned references and server-owned
        IDs/organization/timestamps. Synthetic fixtures only. All responses no-store. Gateway
        validates public cookie/Origin/CSRF; trusted private request uses delegated token and
        X-OC-Client-Signal. Identity revalidates current authority <=2000ms, checked before
        reads/replays and after locks before commit; no distributed atomicity claimed.
        Idempotency-Key UUIDv7 required; replay original status/body/Location/version for 7 days
        with current authority, no cookie rotation. Unknown/duplicate fields rejected;
        validate/normalize before catalog-request-v1 JCS.
      security:
        - delegatedBearer: []
      x-permission: catalog.manage
      x-internal: true
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            $ref: ../../shared/v1/catalog-common-v1.schema.json#/$defs/IdempotencyKey
        - name: X-OC-Client-Signal
          in: header
          required: true
          schema:
            $ref: ../../shared/v1/catalog-common-v1.schema.json#/$defs/ClientSignal
          description: Trusted gateway derived; never grants authority or enters public hash.
      responses:
        "201":
          description: Successful createCatalogCategory
          headers:
            Cache-Control:
              required: true
              schema:
                $ref: ../../shared/v1/catalog-common-v1.schema.json#/$defs/CacheControl
            ETag:
              required: true
              schema:
                $ref: ../../shared/v1/catalog-common-v1.schema.json#/$defs/ETag
            Idempotency-Replayed:
              required: true
              schema:
                $ref: ../../shared/v1/catalog-common-v1.schema.json#/$defs/IdempotencyReplayed
            Location:
              required: true
              schema:
                $ref: ../../shared/v1/catalog-common-v1.schema.json#/$defs/Location
          content:
            application/json:
              schema:
                $ref: ../../shared/v1/catalog-entities-v1.schema.json#/$defs/Category
