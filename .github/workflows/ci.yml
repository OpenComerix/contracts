# GitHub Actions migration; original job commands and artifact edges preserved.
name: OpenComerix CI
on:
  push:
    tags:
      - '**'
  workflow_dispatch:
    inputs:
      sales_only:
        description: Sales diagnostic only; full CI remains required for closure
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  validation_scope:
    name: validate:scope
    runs-on: ubuntu-24.04
    container:
      image: node:24.21.0-bookworm-slim
    env:
      COREPACK_HOME: ${{ github.workspace }}/.corepack-cache
      PNPM_VERSION: 12.4.2
      PNPM_STORE_DIR: .pnpm-store
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
    steps:
      - name: Install checkout and test tools
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates openssl
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - name: Prepare frozen dependencies
        id: dependencies
        uses: opencomerix/ci-templates/.github/actions/node-pnpm@50993e3a20827ca71db4383e19ac8159aed26404
        with:
          install-mode: ignore-scripts
      - name: Select validation and run partial checks for advances
        id: scope
        run: node scripts/ci/validation-scope-v1.mjs
        env:
          CONTRACTS_SALES_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.sales_only }}
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: ${{ github.workspace }}
  validate_contract_references:
    name: validate:contract-references
    needs: [validation_scope]
    if: needs.validation_scope.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    container:
      image: node:24.21.0-bookworm-slim
    env:
      COREPACK_HOME: ${{ github.workspace }}/.corepack-cache
      PNPM_VERSION: 12.4.2
      PNPM_STORE_DIR: .pnpm-store
    steps:
      - name: Install checkout and test tools
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates openssl
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - name: Run original validation commands
        run: node scripts/validate-contract-refs.mjs
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: ${{ github.workspace }}
  validate_openapi:
    name: validate:openapi
    needs: [validation_scope]
    if: needs.validation_scope.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    container:
      image: node:24.21.0-bookworm-slim
    env:
      CONTRACTS_CACHE_POLICY: pull
      NPM_CONFIG_CACHE: ${{ github.workspace }}/.npm-cache
      REDOCLY_TELEMETRY: off
      REDOCLY_SUPPRESS_UPDATE_NOTICE: "true"
      COREPACK_HOME: ${{ github.workspace }}/.corepack-cache
      PNPM_VERSION: 12.4.2
      PNPM_STORE_DIR: .pnpm-store
    steps:
      - name: Install checkout and test tools
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates openssl
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - name: Restore exact Redocly cache
        id: npm_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |-
            .npm-cache/_cacache/
            .npm-cache/_npx/
          key: node24.21.0-redocly2.53.3-bookworm-v1
      - name: Run original validation commands
        run: |-
          npx --yes @redocly/cli@2.53.3 lint openapi/pos-sales-v1.yaml openapi/pos-sync-v1.json
          node scripts/validate-redocly-no-warnings.mjs
          npx --yes @redocly/cli@2.53.3 bundle openapi/identity-onboarding-v1.yaml --dereferenced --ext json --output /tmp/identity-onboarding-v1.bundle.json
          node scripts/prepare-identity-rest-fixtures.mjs /tmp/identity-onboarding-v1.bundle.json .ci-artifacts/identity-rest-fixtures --self-test
          node scripts/validate-redocly-no-warnings.mjs openapi/identity-onboarding-v2.yaml
          npx --yes @redocly/cli@2.53.3 bundle openapi/identity-onboarding-v2.yaml --dereferenced --ext json --output /tmp/identity-onboarding-v2.bundle.json
          node scripts/validate-gateway-deadline-exceeded-v5.mjs /tmp/identity-onboarding-v2.bundle.json --self-test
          node scripts/prepare-identity-rest-fixtures-v2.mjs /tmp/identity-onboarding-v2.bundle.json .ci-artifacts/identity-rest-v2-fixtures --self-test
          node scripts/prepare-device-registration-challenge-v2.mjs /tmp/identity-onboarding-v2.bundle.json .ci-artifacts/device-registration-challenge-v2 --self-test
          node scripts/validate-redocly-no-warnings.mjs openapi/identity-internal-auth-v1.yaml
          npx --yes @redocly/cli@2.53.3 bundle openapi/identity-internal-auth-v1.yaml --dereferenced --ext json --output /tmp/identity-internal-auth-v1.bundle.json
          node scripts/prepare-identity-internal-auth-fixtures.mjs /tmp/identity-internal-auth-v1.bundle.json .ci-artifacts/identity-internal-auth-fixtures --self-test
          node scripts/validate-redocly-no-warnings.mjs openapi/identity-gateway-delegation-v1.yaml
          npx --yes @redocly/cli@2.53.3 bundle openapi/identity-gateway-delegation-v1.yaml --dereferenced --ext json --output /tmp/identity-gateway-delegation-v1.bundle.json
          node scripts/validate-gateway-identity-policy.mjs /tmp/identity-onboarding-v1.bundle.json /tmp/identity-gateway-delegation-v1.bundle.json --self-test
          node scripts/validate-redocly-no-warnings.mjs openapi/identity-gateway-delegation-v2.yaml
          npx --yes @redocly/cli@2.53.3 bundle openapi/identity-gateway-delegation-v2.yaml --dereferenced --ext json --output /tmp/identity-gateway-delegation-v2.bundle.json
          node scripts/validate-gateway-identity-policy-v2.mjs /tmp/identity-onboarding-v2.bundle.json /tmp/identity-gateway-delegation-v2.bundle.json --self-test
          node scripts/validate-client-signal-v1.mjs /tmp/identity-onboarding-v2.bundle.json /tmp/identity-gateway-delegation-v2.bundle.json --self-test
          node scripts/validate-membership-pagination-v2.mjs /tmp/identity-onboarding-v2.bundle.json --self-test
          node scripts/validate-error-catalog-v4.mjs /tmp/identity-onboarding-v2.bundle.json --self-test
          node scripts/validate-csrf-contract-v3.mjs /tmp/identity-onboarding-v2.bundle.json /tmp/identity-gateway-delegation-v2.bundle.json --self-test
          node scripts/validate-session-rotation-replay-v5.mjs /tmp/identity-onboarding-v2.bundle.json /tmp/identity-gateway-delegation-v2.bundle.json --self-test
          node scripts/prepare-session-rotation-replay-v5.mjs /tmp/identity-onboarding-v2.bundle.json /tmp/identity-gateway-delegation-v2.bundle.json .ci-artifacts/session-rotation-replay-v5 --self-test
          node scripts/validate-session-step-up-v1.mjs /tmp/identity-onboarding-v2.bundle.json /tmp/identity-gateway-delegation-v2.bundle.json --self-test
          node scripts/prepare-session-step-up-v1.mjs /tmp/identity-onboarding-v2.bundle.json /tmp/identity-gateway-delegation-v2.bundle.json .ci-artifacts/session-step-up-v1 --self-test
          node scripts/prepare-owner-session-flow-v1.mjs /tmp/identity-onboarding-v2.bundle.json .ci-artifacts/owner-session-flow-v1
          node scripts/validate-owner-session-flow-v1.mjs /tmp/identity-onboarding-v2.bundle.json --self-test
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: ${{ github.workspace }}
      - name: Package original artifact paths
        if: success()
        shell: bash
        run: |-
          paths=()
          for path in .ci-artifacts/identity-rest-fixtures/ .ci-artifacts/identity-rest-v2-fixtures/ .ci-artifacts/device-registration-challenge-v2/ .ci-artifacts/identity-internal-auth-fixtures/ .ci-artifacts/session-rotation-replay-v5/ .ci-artifacts/session-step-up-v1/ .ci-artifacts/owner-session-flow-v1/; do
            if [ -e "$path" ]; then paths+=("$path"); fi
          done
          if [ "${#paths[@]}" -eq 0 ]; then echo '::warning::No matching original artifact paths'; fi
          tar -czf "$RUNNER_TEMP/artifacts.tgz" --files-from /dev/null "${paths[@]}"
      - name: Upload validation artifacts
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: validate_openapi
          path: ${{ runner.temp }}/artifacts.tgz
          retention-days: 1
          if-no-files-found: error
  validate_json_schema:
    name: validate:json-schema
    if: needs.validation_scope.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    needs:
      - validation_scope
      - validate_openapi
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - name: Download artifacts from validate:openapi
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: validate_openapi
          path: ${{ runner.temp }}/validate_openapi
      - name: Restore artifact paths from validate:openapi
        run: tar -xzf "$RUNNER_TEMP/validate_openapi/artifacts.tgz"
      - name: Run original validation commands
        run: |-
          docker run --rm --entrypoint /bin/sh -v "$PWD:/workspace" -w /workspace ghcr.io/sourcemeta/jsonschema:v16.10.0 -ec 'jsonschema metaschema events commands/*.schema.json openapi/problem-details-v1.schema.json openapi/problem-details-v2.schema.json openapi/device-proof-v1-vectors.schema.json openapi/identity-gateway-delegation-v2.schema.json openapi/client-signal-v1.schema.json openapi/membership-pagination-v2.schema.json openapi/csrf-v3-problem.schema.json openapi/session-step-up-v1-fixtures.schema.json errors/error-catalog-v1.schema.json errors/error-catalog-v2.schema.json errors/error-catalog-v3.schema.json errors/error-catalog-v4.schema.json errors/error-catalog-v5.schema.json --verbose
          jsonschema metaschema .ci-artifacts/owner-session-flow-v1/*.schema.json --default-dialect https://json-schema.org/draft/2020-12/schema --verbose
          jsonschema validate openapi/client-signal-v1.schema.json openapi/client-signal-v1-fixtures.json --verbose
          jsonschema validate openapi/session-step-up-v1-fixtures.schema.json openapi/session-step-up-v1-fixtures.json --verbose
          jsonschema validate errors/error-catalog-v1.schema.json errors/error-catalog-v1.json --verbose
          jsonschema validate errors/error-catalog-v2.schema.json errors/error-catalog-v2.json --verbose
          jsonschema validate errors/error-catalog-v4.schema.json errors/error-catalog-v4.json --verbose
          sh scripts/validate-gateway-deadline-exceeded-v5.sh
          sh scripts/validate-csrf-fixtures-v3.sh
          jsonschema validate openapi/device-proof-v1-vectors.schema.json openapi/device-proof-v1-vectors.json --verbose
          jsonschema validate commands/notifications.send-email-verification.v1.schema.json commands/examples/notifications.send-email-verification.v1.example.json --resolve commands/command-envelope-v1.schema.json --verbose
          jsonschema validate commands/notifications.send-email-verification.result.v1.schema.json commands/examples/notifications.send-email-verification.result.succeeded.v1.example.json commands/examples/notifications.send-email-verification.result.failed-retryable.v1.example.json --resolve commands/command-result-envelope-v1.schema.json --verbose
          jsonschema validate commands/notifications.send-device-approval.v1.schema.json commands/examples/notifications.send-device-approval.v1.example.json --resolve commands/command-envelope-v1.schema.json --verbose
          jsonschema validate commands/notifications.send-device-approval.result.v1.schema.json commands/examples/notifications.send-device-approval.result.succeeded.v1.example.json commands/examples/notifications.send-device-approval.result.failed-retryable.v1.example.json --resolve commands/command-result-envelope-v1.schema.json --verbose
          sh scripts/validate-identity-rest-fixtures.sh .ci-artifacts/identity-rest-fixtures
          sh scripts/validate-identity-rest-fixtures-v2.sh .ci-artifacts/identity-rest-v2-fixtures
          sh scripts/validate-device-registration-challenge-v2.sh .ci-artifacts/device-registration-challenge-v2
          sh scripts/validate-membership-pagination-v2.sh
          sh scripts/validate-session-rotation-replay-v5.sh .ci-artifacts/session-rotation-replay-v5
          sh scripts/validate-session-step-up-v1.sh .ci-artifacts/session-step-up-v1
          sh scripts/validate-owner-session-flow-v1.sh .ci-artifacts/owner-session-flow-v1'
  validate_internal_auth_schema:
    name: validate:internal-auth-schema
    if: needs.validation_scope.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    needs:
      - validation_scope
      - validate_openapi
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - name: Download artifacts from validate:openapi
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: validate_openapi
          path: ${{ runner.temp }}/validate_openapi
      - name: Restore artifact paths from validate:openapi
        run: tar -xzf "$RUNNER_TEMP/validate_openapi/artifacts.tgz"
      - name: Run original validation commands
        run: |-
          docker run --rm --entrypoint /bin/sh -v "$PWD:/workspace" -w /workspace ghcr.io/sourcemeta/jsonschema:v16.10.0 -ec 'jsonschema metaschema .ci-artifacts/identity-internal-auth-fixtures/schema-*.json --verbose
          sh scripts/validate-identity-internal-auth-fixtures.sh .ci-artifacts/identity-internal-auth-fixtures'
  validate_identity_checklist:
    name: validate:identity-checklist
    needs: [validation_scope]
    if: needs.validation_scope.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    container:
      image: node:24.21.0-bookworm-slim
    env:
      COREPACK_HOME: ${{ github.workspace }}/.corepack-cache
      PNPM_VERSION: 12.4.2
      PNPM_STORE_DIR: .pnpm-store
    steps:
      - name: Install checkout and test tools
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates openssl
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - name: Run original validation commands
        run: |-
          node scripts/validate-contract-refs.mjs --self-test
          node scripts/validate-identity-onboarding.mjs --self-test
          node scripts/validate-device-proof-vectors.mjs
          node --check scripts/validate-client-signal-v1.mjs
          node --check scripts/validate-session-rotation-replay-v5.mjs
          node --check scripts/session-step-up-v1-common.mjs
          node --check scripts/prepare-session-step-up-v1.mjs
          node --check scripts/validate-session-step-up-v1.mjs
          node --check scripts/prepare-session-rotation-replay-v5.mjs
          sh -n scripts/validate-session-rotation-replay-v5.sh
          sh -n scripts/validate-session-step-up-v1.sh
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: ${{ github.workspace }}
  validate_gateway_delegation_schema:
    name: validate:gateway-delegation-schema
    needs: [validation_scope]
    if: needs.validation_scope.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - name: Run original validation commands
        run: |-
          docker run --rm --entrypoint /bin/sh -v "$PWD:/workspace" -w /workspace ghcr.io/sourcemeta/jsonschema:v16.10.0 -ec 'jsonschema metaschema openapi/identity-gateway-delegation-v1.schema.json --verbose
          sh scripts/validate-gateway-delegation-schemas.sh
          jsonschema metaschema openapi/identity-gateway-delegation-v2.schema.json --verbose
          sh scripts/validate-gateway-delegation-v2-schemas.sh'
  validate_contract_architecture:
    name: validate:contract-architecture
    needs: [validation_scope]
    if: needs.validation_scope.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    container:
      image: node:24.21.0-bookworm-slim
    env:
      CONTRACTS_CACHE_POLICY: pull
      NPM_CONFIG_CACHE: ${{ github.workspace }}/.npm-cache
      COREPACK_HOME: ${{ github.workspace }}/.corepack-cache
      GIT_DEPTH: "0"
      PNPM_VERSION: 12.4.2
      PNPM_STORE_DIR: .pnpm-store
    steps:
      - name: Install checkout and test tools
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates openssl
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - name: Prepare frozen dependencies
        id: dependencies
        uses: opencomerix/ci-templates/.github/actions/node-pnpm@50993e3a20827ca71db4383e19ac8159aed26404
        with:
          install-mode: ignore-scripts
      - name: Restore exact Redocly cache
        id: npm_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |-
            .npm-cache/_cacache/
            .npm-cache/_npx/
          key: node24.21.0-redocly2.53.3-bookworm-v1
      - name: Run original validation commands
        run: |-
          node --test --test-concurrency=2 test/architecture/*.test.mjs
          node --test --test-reporter=tap test/ci/*.test.mjs
          pnpm registry:check
          pnpm contracts:consumers
          pnpm contracts:impact --output .ci-artifacts/contract-impact.json
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: ${{ github.workspace }}
      - name: Package original artifact paths
        if: always()
        shell: bash
        run: |-
          paths=()
          for path in .ci-artifacts/contract-impact.json; do
            if [ -e "$path" ]; then paths+=("$path"); fi
          done
          if [ "${#paths[@]}" -eq 0 ]; then echo '::warning::No matching original artifact paths'; fi
          tar -czf "$RUNNER_TEMP/artifacts.tgz" --files-from /dev/null "${paths[@]}"
      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: validate_contract_architecture
          path: ${{ runner.temp }}/artifacts.tgz
          retention-days: 7
          if-no-files-found: error
  validate_contract_metadata_schema:
    name: validate:contract-metadata-schema
    needs: [validation_scope]
    if: needs.validation_scope.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - name: Run original validation commands
        run: docker run --rm --entrypoint /bin/sh -v "$PWD:/workspace" -w /workspace ghcr.io/sourcemeta/jsonschema:v16.10.0 -ec 'jsonschema metaschema registry/manifest-v1.schema.json registry/lock-v1.schema.json --verbose'
  validate_catalog_contracts:
    name: validate:catalog-contracts
    needs: [validation_scope]
    if: needs.validation_scope.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    container:
      image: node:24.21.0-bookworm-slim
    env:
      CONTRACTS_CACHE_POLICY: pull-push
      NPM_CONFIG_CACHE: ${{ github.workspace }}/.npm-cache
      COREPACK_HOME: ${{ github.workspace }}/.corepack-cache
      GIT_DEPTH: "0"
      REDOCLY_TELEMETRY: off
      REDOCLY_SUPPRESS_UPDATE_NOTICE: "true"
      PNPM_VERSION: 12.4.2
      PNPM_STORE_DIR: .pnpm-store
    steps:
      - name: Install checkout and test tools
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates openssl
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - name: Prepare frozen dependencies
        id: dependencies
        uses: opencomerix/ci-templates/.github/actions/node-pnpm@50993e3a20827ca71db4383e19ac8159aed26404
        with:
          install-mode: ignore-scripts
      - name: Restore exact Redocly cache
        id: npm_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |-
            .npm-cache/_cacache/
            .npm-cache/_npx/
          key: node24.21.0-redocly2.53.3-bookworm-v1
      - name: Prepare job
        run: mkdir -p .npm-cache/_cacache .npm-cache/_npx
      - name: Run original validation commands
        run: |-
          node --test test/catalog/*.test.mjs
          node scripts/validate-redocly-no-warnings.mjs identity/http/private/v1/identity-catalog-authority-v1.yaml
          node scripts/validate-redocly-no-warnings.mjs catalog/http/public/v1/catalog-pricing-v1.yaml
          node scripts/validate-redocly-no-warnings.mjs catalog/http/private/v1/catalog-pricing-internal-v1.yaml
          npx --yes @redocly/cli@2.53.3 bundle identity/http/private/v1/identity-catalog-authority-v1.yaml --dereferenced --ext json --output .ci-artifacts/catalog-authority-v1.bundle.json
          npx --yes @redocly/cli@2.53.3 bundle catalog/http/public/v1/catalog-pricing-v1.yaml --dereferenced --ext json --output .ci-artifacts/catalog-public-v1.bundle.json
          npx --yes @redocly/cli@2.53.3 bundle catalog/http/private/v1/catalog-pricing-internal-v1.yaml --dereferenced --ext json --output .ci-artifacts/catalog-private-v1.bundle.json
          node scripts/catalog/validate-security-v1.mjs .ci-artifacts/catalog-authority-v1.bundle.json .ci-artifacts/catalog-security-v1 --self-test
          node scripts/catalog/validate-http-v1.mjs .ci-artifacts/catalog-public-v1.bundle.json .ci-artifacts/catalog-private-v1.bundle.json .ci-artifacts/catalog-http-v1 --self-test
          node scripts/catalog/validate-pricing-http-v1.mjs .ci-artifacts/catalog-public-v1.bundle.json .ci-artifacts/catalog-private-v1.bundle.json .ci-artifacts/catalog-pricing-v1 --self-test
          node scripts/catalog/validate-events-v1.mjs .ci-artifacts/catalog-events-v1 --self-test
          node scripts/catalog/validate-history-policy-v1.mjs .ci-artifacts/catalog-history-policy-v1 --self-test
          node scripts/validate-redocly-no-warnings.mjs catalog/http/private/v1/catalog-history-protection-v1.yaml
          npx --yes @redocly/cli@2.53.3 bundle catalog/http/private/v1/catalog-history-protection-v1.yaml --dereferenced --ext json --output .ci-artifacts/catalog-history-protection-v1.bundle.json
