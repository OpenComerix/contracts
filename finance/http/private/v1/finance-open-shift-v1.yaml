  "paths": {
    "/finance/cash-registers/{cash_register_id}/open-shift": {
      "get": {
        "tags": [
          "Finance"
        ],
        "operationId": "getOpenCashShift",
        "summary": "Find the current responsible open shift without opening another",
        "description": "Existing Finance active-human checks and current branch/POS scopes. Finance verifies local register/shift tenant and relation; only the original responsible account/membership/device may recover an open shift. Another responsible gets generic403 identity_access_denied, without IDs/names/amounts. Missing/out-of-scope register uses same404 finance_resource_not_found. Valid register without open shift returns200 cash_shift=null. Multiple open rows are integrity failure500 platform_internal_error, never select first. Read only; no reopening, responsible reassignment, funds, commercial events or reservation. Concurrent opening can make absence stale; opening retains its unique-register constraint. Follow getCashShift/getCashShiftExpected separately with fresh authorization.",
        "parameters": [
          {
            "name": "cash_register_id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid",
              "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
            },
            "description": "Owner resource reference, never authority."
          },
          {
            "name": "X-OC-Client-Signal",
            "in": "header",
            "required": true,
            "schema": {
              "$ref": "../../shared/v1/finance-open-shift-v1.schema.json#/$defs/PrivateClientSignal"
            },
            "description": "Exact canonical gateway-derived v1 HMAC signal, identical to Identity delegation/authorization client_signal. Gateway strips browser copies and derives it from trusted ingress. After workload authentication, absent, duplicate (even identical), joined or malformed fields fail 400 finance_invalid_request. Never log or persist; not included in the seven-field request hash, never authority."
          }
        ],
        "responses": {
          "200": {
            "description": "Current open shift reference or explicit absence; no side effects.",
            "headers": {
              "Cache-Control": {
                "description": "Normative response header.",
                "required": true,
                "schema": {
                  "const": "no-store"
                }
              },
              "ETag": {
                "description": "Normative response header.",
                "required": true,
                "schema": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 200
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "../../shared/v1/finance-open-shift-v1.schema.json#/$defs/HttpOpenShift"
                },
                "x-producer-schema": {
                  "$ref": "../../shared/v1/finance-open-shift-v1.schema.json#/$defs/OpenShift"
                },
                "examples": {
                  "absent": {
                    "externalValue": "../../../fixtures/open-shift/v1/responses.json#/absent"
                  },
                  "open": {
                    "externalValue": "../../../fixtures/open-shift/v1/responses.json#/open"
                  }
                }
              }
            }
          },
          "400": {
